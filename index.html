<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOEX Trading Terminal</title>
    <script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <script>if(typeof LightweightCharts==='undefined')document.write('<script src="node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js"><\/script>')</script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script>if(typeof echarts==='undefined')document.write('<script src="node_modules/echarts/dist/echarts.min.js"><\/script>')</script>
    <script src="https://cdn.jsdelivr.net/npm/split.js@1.6.5/dist/split.min.js"></script>
    <script>if(typeof Split==='undefined')document.write('<script src="node_modules/split.js/dist/split.min.js"><\/script>')</script>
    <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <link rel="stylesheet" href="node_modules/tabulator-tables/dist/css/tabulator_midnight.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/js/tabulator.min.js"></script>
    <script>if(typeof Tabulator==='undefined')document.write('<script src="node_modules/tabulator-tables/dist/js/tabulator.min.js"><\/script>')</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #131722; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #d1d4dc; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        .ticker-tape { background: #1a1d29; border-bottom: 1px solid #2a2e39; overflow: hidden; height: 28px; position: relative; flex-shrink: 0; }
        .tape-track { display: flex; align-items: center; height: 100%; animation: tape-scroll 45s linear infinite; white-space: nowrap; width: max-content; }
        @keyframes tape-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .tape-item { display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; font-size: 11px; border-right: 1px solid #2a2e39; height: 100%; }
        .tape-ticker { font-weight: 600; color: #d1d4dc; }
        .tape-price { color: #9598a1; }
        .tape-change { font-weight: 600; }

        .app { display: flex; flex: 1; min-height: 0; }

        .watchlist { width: 210px; background: #1a1d29; border-right: 1px solid #2a2e39; display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.2s; overflow: hidden; }
        .watchlist.collapsed { width: 0; border-right: none; }
        .side-header { padding: 8px 12px; border-bottom: 1px solid #2a2e39; font-size: 12px; font-weight: 600; color: #787b86; }
        .wl-body { flex: 1; overflow-y: auto; }
        .wl-body::-webkit-scrollbar, .ob-body::-webkit-scrollbar { width: 4px; }
        .wl-body::-webkit-scrollbar-thumb, .ob-body::-webkit-scrollbar-thumb { background: #363a45; border-radius: 2px; }
        .wl-item { display: flex; align-items: center; padding: 6px 10px; cursor: pointer; border-bottom: 1px solid rgba(42,46,57,0.3); gap: 4px; }
        .wl-item:hover { background: rgba(42,46,57,0.5); }
        .wl-item.active { background: rgba(41,98,255,0.12); border-left: 3px solid #2962ff; padding-left: 7px; }
        .wl-info { flex: 1; min-width: 0; }
        .wl-ticker { font-size: 12px; font-weight: 600; }
        .wl-name { font-size: 10px; color: #787b86; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .wl-spark { flex-shrink: 0; }
        .wl-right { text-align: right; flex-shrink: 0; }
        .wl-price { font-size: 12px; }
        .wl-change { font-size: 10px; font-weight: 600; }

        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        .toolbar { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: #1e222d; border-bottom: 1px solid #2a2e39; flex-shrink: 0; flex-wrap: wrap; }
        .toolbar h1 { font-size: 14px; font-weight: 600; color: #787b86; }
        .icon-btn { background: none; border: 1px solid #363a45; color: #787b86; padding: 2px 7px; border-radius: 3px; cursor: pointer; font-size: 12px; line-height: 1.4; }
        .icon-btn:hover { color: #d1d4dc; border-color: #787b86; }
        .icon-btn.active { color: #2962ff; border-color: #2962ff; background: rgba(41,98,255,0.1); }
        .tickers { display: flex; gap: 3px; flex-wrap: wrap; }
        .tickers button { background: #2a2e39; color: #d1d4dc; border: 1px solid #363a45; padding: 3px 9px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .tickers button:hover { background: #363a45; }
        .tickers button.active { background: #2962ff; border-color: #2962ff; color: #fff; }
        .timeframes { display: flex; gap: 2px; }
        .timeframes button { background: transparent; color: #787b86; border: none; padding: 3px 7px; border-radius: 3px; cursor: pointer; font-size: 12px; }
        .timeframes button:hover { color: #d1d4dc; }
        .timeframes button.active { color: #2962ff; background: rgba(41,98,255,0.1); }
        .vsep { width: 1px; height: 18px; background: #2a2e39; margin: 0 2px; }
        .toggle-lbl { display: flex; align-items: center; gap: 3px; font-size: 11px; color: #787b86; cursor: pointer; }

        .info-bar { display: flex; align-items: center; gap: 12px; padding: 3px 12px; background: #1e222d; border-bottom: 1px solid #2a2e39; font-size: 12px; flex-shrink: 0; flex-wrap: wrap; }
        .info-bar .ticker-name { font-size: 15px; font-weight: 600; }
        .info-bar .price { font-size: 14px; font-weight: 600; }
        .info-bar .change { font-size: 12px; font-weight: 500; }
        .info-bar .label { color: #787b86; }
        .info-bar .val { color: #d1d4dc; margin-left: 3px; }
        .info-bar .sep { color: #363a45; }
        .delay-badge { background: rgba(255,152,0,0.15); color: #ff9800; font-size: 10px; padding: 1px 6px; border-radius: 3px; border: 1px solid rgba(255,152,0,0.3); margin-left: auto; }
        .ticker-search-wrap { position: relative; }
        #ticker-search { background: #2a2e39; border: 1px solid #363a45; color: #d1d4dc; padding: 3px 8px; border-radius: 4px; font-size: 12px; width: 130px; outline: none; }
        #ticker-search:focus { border-color: #2962ff; }
        .ticker-results { position: absolute; top: 100%; left: 0; background: #1e222d; border: 1px solid #363a45; border-radius: 4px; max-height: 200px; overflow-y: auto; z-index: 100; width: 200px; display: none; }
        .ticker-results.show { display: block; }
        .ticker-result { padding: 5px 10px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; }
        .ticker-result:hover { background: #2a2e39; }
        .ticker-result .tr-name { color: #787b86; font-size: 11px; }
        .wl-item .wl-del { display: none; background: none; border: none; color: #ef5350; cursor: pointer; font-size: 14px; padding: 0 4px; line-height: 1; }
        .wl-item:hover .wl-del { display: block; }
        .regime-badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; border: 1px solid; margin-left: 6px; }
        .green { color: #26a69a; }
        .red { color: #ef5350; }

        #chart-container { flex: 1; min-height: 0; position: relative; }

        .bottom-panel { height: 170px; background: #1a1d29; border-top: 1px solid #2a2e39; display: flex; flex-direction: column; flex-shrink: 0; transition: height 0.2s; }
        .bottom-panel.collapsed { height: 26px; }
        .panel-tabs { display: flex; background: #1e222d; flex-shrink: 0; }
        .panel-tab { background: none; border: none; color: #787b86; padding: 5px 12px; cursor: pointer; font-size: 11px; border-bottom: 2px solid transparent; }
        .panel-tab:hover { color: #d1d4dc; }
        .panel-tab.active { color: #d1d4dc; border-bottom-color: #2962ff; }
        .panel-collapse { margin-left: auto; background: none; border: none; color: #787b86; cursor: pointer; padding: 5px 10px; font-size: 12px; }
        .panel-body { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 12px; display: none; }
        .panel-body.active { display: block; }
        .panel-body::-webkit-scrollbar { width: 4px; }
        .panel-body::-webkit-scrollbar-thumb { background: #363a45; border-radius: 2px; }

        .adv-wrap { display: flex; gap: 12px; height: 100%; }
        #adv-text { flex: 1; min-width: 0; }
        #adv-gauge { width: 180px; height: 120px; flex-shrink: 0; }
        .adv-line { padding: 2px 0; line-height: 1.5; }
        .adv-rec { margin-top: 6px; padding: 8px; border-radius: 4px; background: #1e222d; }
        .adv-rec.buy { border-left: 3px solid #26a69a; }
        .adv-rec.sell { border-left: 3px solid #ef5350; }
        .adv-rec.neutral { border-left: 3px solid #787b86; }
        .adv-rec b { font-size: 14px; }
        .muted { color: #787b86; }

        table.data { width: 100%; border-collapse: collapse; font-size: 11px; }
        table.data th { text-align: left; color: #787b86; font-weight: 500; padding: 3px 8px; border-bottom: 1px solid #2a2e39; }
        table.data td { padding: 3px 8px; border-bottom: 1px solid rgba(42,46,57,0.3); }
        .del-btn { background: none; border: none; color: #ef5350; cursor: pointer; font-size: 12px; }

        #bt-stats { margin-bottom: 4px; }
        #equity-chart { height: 70px; width: 100%; }

        #heatmap-container { width: 100%; height: 100%; min-height: 120px; }
        #screener-table { height: 100%; }

        .status-bar { padding: 3px 12px; font-size: 11px; color: #787b86; background: #1e222d; border-top: 1px solid #2a2e39; flex-shrink: 0; }

        .orderbook { width: 220px; background: #1a1d29; border-left: 1px solid #2a2e39; display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.2s; overflow: hidden; }
        .orderbook.collapsed { width: 0; border-left: none; }
        #depth-chart { height: 160px; flex-shrink: 0; border-bottom: 1px solid #2a2e39; }
        .ob-body { flex: 1; overflow-y: auto; }
        .ob-row { position: relative; display: flex; justify-content: space-between; padding: 2px 8px; font-size: 11px; }
        .ob-bar { position: absolute; top: 0; bottom: 0; right: 0; opacity: 0.18; }
        .ob-row.ask .ob-bar { background: #ef5350; }
        .ob-row.bid .ob-bar { background: #26a69a; }
        .ob-row.ask .ob-price { color: #ef5350; }
        .ob-row.bid .ob-price { color: #26a69a; }
        .ob-price, .ob-vol { z-index: 1; }
        .ob-vol { color: #787b86; }
        .ob-spread { padding: 4px 8px; font-size: 11px; color: #787b86; text-align: center; border-top: 1px solid #2a2e39; border-bottom: 1px solid #2a2e39; background: #1e222d; }

        .overlay-wrap { position: relative; }
        .overlay-panel { display: none; position: absolute; top: 100%; right: 0; background: #1e222d; border: 1px solid #363a45; border-radius: 4px; padding: 8px; z-index: 100; width: 260px; }
        .overlay-panel.show { display: block; }
        #overlay-search { background: #2a2e39; border: 1px solid #363a45; color: #d1d4dc; padding: 4px 8px; border-radius: 4px; font-size: 12px; width: 100%; outline: none; margin-bottom: 4px; }
        #overlay-search:focus { border-color: #2962ff; }
        .overlay-results { max-height: 150px; overflow-y: auto; }
        .overlay-result { padding: 4px 8px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; border-radius: 3px; }
        .overlay-result:hover { background: #2a2e39; }
        .overlay-result .or-info { color: #787b86; font-size: 10px; }
        .overlay-active { margin-top: 4px; border-top: 1px solid #2a2e39; padding-top: 4px; }
        .overlay-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 3px; font-size: 11px; margin: 2px; background: #2a2e39; }
        .overlay-tag .ot-dot { width: 8px; height: 8px; border-radius: 50%; }
        .overlay-tag .ot-remove { cursor: pointer; color: #ef5350; font-size: 13px; margin-left: 4px; }

        .multichart-overlay { display: none; position: fixed; inset: 0; background: #131722; z-index: 200; }
        .multichart-overlay.show { display: flex; flex-direction: column; }
        .mc-header { display: flex; align-items: center; padding: 6px 12px; background: #1e222d; border-bottom: 1px solid #2a2e39; gap: 10px; }
        .mc-header h2 { font-size: 14px; color: #787b86; font-weight: 600; }
        .mc-close { background: none; border: 1px solid #363a45; color: #d1d4dc; padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; margin-left: auto; }
        .mc-grid { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .mc-row { display: flex; flex: 1; min-height: 0; }
        .mc-cell { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; background: #1a1d29; }
        .mc-cell-header { padding: 4px 8px; font-size: 12px; font-weight: 600; background: #1e222d; border-bottom: 1px solid #2a2e39; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .mc-cell-header:hover { color: #2962ff; }
        .mc-cell-header .mc-price { font-weight: 400; font-size: 11px; }
        .mc-chart { flex: 1; min-height: 0; }
        .gutter { background: #2a2e39; background-repeat: no-repeat; background-position: 50%; }
        .gutter.gutter-horizontal { cursor: col-resize; }
        .gutter.gutter-vertical { cursor: row-resize; }

        #chart-container.draw-active { cursor: crosshair; }

        @media (max-width: 768px) {
            .ticker-tape { height: 24px; }
            .tape-item { padding: 0 10px; font-size: 10px; }
            .watchlist { width: 0; border-right: none; }
            .watchlist:not(.collapsed) { width: 170px; position: absolute; z-index: 50; height: 100%; }
            .orderbook { width: 0; border-left: none; }
            .orderbook:not(.collapsed) { width: 170px; position: absolute; right: 0; z-index: 50; height: 100%; }
            .tickers { display: none; }
            .toolbar { gap: 4px; padding: 3px 6px; }
            .icon-btn { padding: 2px 5px; font-size: 11px; }
            .info-bar { gap: 6px; padding: 2px 8px; font-size: 11px; }
            .info-bar .ticker-name { font-size: 13px; }
            .info-bar .price { font-size: 12px; }
            #ticker-search { width: 90px; font-size: 11px; }
            .bottom-panel { height: 120px; }
            .vsep { display: none; }
        }
    </style>
</head>
<body>
    <div class="ticker-tape" id="ticker-tape"><div class="tape-track" id="tape-track"></div></div>
    <div class="app">
        <aside class="watchlist" id="watchlist">
            <div class="side-header">Вотчлист</div>
            <div class="wl-body" id="wl-body"></div>
        </aside>
        <div class="main">
            <div class="toolbar">
                <button class="icon-btn" id="wl-toggle" title="Вотчлист">&#9776;</button>
                <h1>MOEX</h1>
                <div class="ticker-search-wrap"><input type="text" id="ticker-search" placeholder="Поиск тикера..." autocomplete="off"><div class="ticker-results" id="ticker-results"></div></div>
                <div class="tickers" id="ticker-bar"></div>
                <div class="vsep"></div>
                <div class="timeframes" id="tf-bar"></div>
                <div class="vsep"></div>
                <button class="icon-btn" data-tool="hline" title="Горизонтальный уровень">Уровень</button>
                <button class="icon-btn" data-tool="alert" title="Алерт по цене">Алерт</button>
                <button class="icon-btn" data-tool="fib" title="Фибоначчи">Фибо</button>
                <button class="icon-btn" data-tool="trend" title="Трендлиния">Тренд</button>
                <button class="icon-btn" id="clear-draw" title="Очистить рисунки">Очистить</button>
                <div class="vsep"></div>
                <label class="toggle-lbl"><input type="checkbox" id="sig-toggle" checked> Сигналы</label>
                <label class="toggle-lbl"><input type="checkbox" id="sr-toggle" checked> S/R</label>
                <div class="vsep"></div>
                <div class="overlay-wrap">
                    <button class="icon-btn" id="overlay-btn" title="Оверлей">Оверлей</button>
                    <div class="overlay-panel" id="overlay-panel">
                        <input type="text" id="overlay-search" placeholder="USD, Brent, IMOEX..." autocomplete="off">
                        <div class="overlay-results" id="overlay-results"></div>
                        <div class="overlay-active" id="overlay-active"></div>
                    </div>
                </div>
                <button class="icon-btn" id="multichart-btn" title="Мультичарт 2x2">2x2</button>
                <button class="icon-btn" id="ob-toggle" title="Глубина рынка">Стакан</button>
            </div>
            <div class="info-bar">
                <span class="ticker-name" id="info-ticker">SBER</span>
                <span class="price" id="info-price">&mdash;</span>
                <span class="change" id="info-change">&mdash;</span>
                <span><span class="label">O</span><span class="val" id="info-o">&mdash;</span></span>
                <span><span class="label">H</span><span class="val" id="info-h">&mdash;</span></span>
                <span><span class="label">L</span><span class="val" id="info-l">&mdash;</span></span>
                <span><span class="label">C</span><span class="val" id="info-c">&mdash;</span></span>
                <span><span class="label">Vol</span><span class="val" id="info-v">&mdash;</span></span>
                <span class="sep">|</span>
                <span><span class="label">RSI</span><span class="val" id="info-rsi">&mdash;</span></span>
                <span><span class="label">MACD</span><span class="val" id="info-macd">&mdash;</span></span>
                <span class="regime-badge" id="regime-badge" style="display:none"></span>
                <span class="delay-badge">~15 мин</span>
            </div>
            <div id="chart-container"></div>
            <div class="bottom-panel" id="bottom-panel">
                <div class="panel-tabs">
                    <button class="panel-tab active" data-tab="advisor">Советник</button>
                    <button class="panel-tab" data-tab="signals">Сигналы</button>
                    <button class="panel-tab" data-tab="alerts">Алерты</button>
                    <button class="panel-tab" data-tab="backtest">Бэктест</button>
                    <button class="panel-tab" data-tab="heatmap">Хитмэп</button>
                    <button class="panel-tab" data-tab="screener">Скринер</button>
                    <button class="panel-collapse" id="panel-collapse" title="Свернуть">&#9660;</button>
                </div>
                <div class="panel-body active" id="advisor-body"><div class="adv-wrap"><div id="adv-text"></div><div id="adv-gauge"></div></div></div>
                <div class="panel-body" id="signals-body"></div>
                <div class="panel-body" id="alerts-body"></div>
                <div class="panel-body" id="backtest-body"><div id="bt-stats"></div><div id="equity-chart"></div></div>
                <div class="panel-body" id="heatmap-body"><div id="heatmap-container"></div></div>
                <div class="panel-body" id="screener-body"><div id="screener-table"></div></div>
            </div>
            <div class="status-bar" id="status">Загрузка...</div>
        </div>
        <aside class="orderbook collapsed" id="orderbook">
            <div class="side-header">Глубина рынка</div>
            <div id="depth-chart"></div>
            <div class="ob-body" id="ob-body"></div>
        </aside>
    </div>
    <div class="multichart-overlay" id="multichart-overlay">
        <div class="mc-header"><h2>Мультичарт</h2><button class="mc-close" id="mc-close">Закрыть (Esc)</button></div>
        <div class="mc-grid" id="mc-grid"></div>
    </div>

    <script type="module">
    import { calcSMA, calcBB, calcRSI, calcMACD, calcATR, detectPatterns, findSR, generateSignals, detectRegime, timeKey } from './js/indicators.js';
    import { fetchCandles, fetchPrices, fetchOrderBook, fetchOverlayCandles, searchSecurities } from './js/moex.js';
    import { loadAlerts, addAlert, removeAlert, checkAlerts, requestPermission } from './js/alerts.js';

    const { createChart, CandlestickSeries, LineSeries, HistogramSeries } = LightweightCharts;
    const DRAW_KEY = 'moex_drawings';
    const hasECharts = typeof echarts !== 'undefined';
    const hasSplit = typeof Split !== 'undefined';
    const hasTabulator = typeof Tabulator !== 'undefined';

    const TICKERS = ['SBER','GAZP','LKOH','YNDX','GMKN','ROSN','NVTK','MTSS','MGNT','PLZL'];
    const TIMEFRAMES = [
        { label: '1м', interval: 1, days: 1 },
        { label: '10м', interval: 10, days: 5 },
        { label: '1ч', interval: 60, days: 90 },
        { label: '1д', interval: 24, days: 365 },
        { label: '1н', interval: 7, days: 730 },
        { label: '1мес', interval: 31, days: 1825 },
    ];

    const OVERLAY_COLORS = ['#e040fb', '#00e5ff', '#ffab40', '#69f0ae', '#ff5252'];
    let overlayItems = [];
    let overlaySeries = {};

    let currentTicker = 'SBER', currentTF = TIMEFRAMES[2];
    let dataLookup = new Map();
    let lastData = [], lastIndicators = {};
    let chart;
    let candleSeries, volumeSeries, sma20Series, sma50Series, bb1Series, bb2Series;
    let rsiSeries, macdLineSrs, macdSignalSrs, macdHistSrs;
    let srLines = [], drawSeries = [], drawPriceLines = [], alertLines = [];
    let drawMode = null, pendingPoint = null;
    let depthEChart = null, gaugeEChart = null, treemapEChart = null, equityChart = null;
    let screenerTable = null;
    const sparkCache = {};
    let lastPrices = [];

    function exitDrawMode(msg) {
        drawMode = null; pendingPoint = null;
        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
        document.getElementById('chart-container').classList.remove('draw-active');
        if (msg) setStatus(msg);
    }

    // ---- UI ----
    document.getElementById('wl-toggle').onclick = () => { document.getElementById('watchlist').classList.toggle('collapsed'); setTimeout(resizeChart, 250); };
    document.getElementById('ob-toggle').onclick = () => { const o = document.getElementById('orderbook'); o.classList.toggle('collapsed'); if (!o.classList.contains('collapsed')) refreshOrderBook(); setTimeout(resizeChart, 250); };

    const tickerBar = document.getElementById('ticker-bar');
    TICKERS.forEach((t, i) => {
        const btn = document.createElement('button');
        btn.textContent = t; btn.dataset.ticker = t;
        if (i === 0) btn.classList.add('active');
        btn.onclick = () => selectTicker(t);
        tickerBar.appendChild(btn);
    });

    const tfBar = document.getElementById('tf-bar');
    TIMEFRAMES.forEach((tf, i) => {
        const btn = document.createElement('button');
        btn.textContent = tf.label;
        if (i === 2) btn.classList.add('active');
        btn.onclick = () => { tfBar.querySelectorAll('button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentTF = tf; loadData(); };
        tfBar.appendChild(btn);
    });

    function selectTicker(t) {
        currentTicker = t;
        tickerBar.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.ticker === t));
        document.querySelectorAll('.wl-item').forEach(el => el.classList.toggle('active', el.dataset.ticker === t));
        loadData();
        if (!document.getElementById('orderbook').classList.contains('collapsed')) refreshOrderBook();
    }

    document.querySelectorAll('[data-tool]').forEach(btn => {
        btn.onclick = () => {
            const tool = btn.dataset.tool;
            if (tool === 'hline' || tool === 'alert' || tool === 'fib' || tool === 'trend') {
                if (drawMode === tool) { drawMode = null; pendingPoint = null; }
                else { drawMode = tool; pendingPoint = null; }
                document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === drawMode));
                document.getElementById('chart-container').classList.toggle('draw-active', !!drawMode);
                const hints = { hline: 'Уровень: кликните на графике', alert: 'Алерт: кликните на графике', fib: 'Фибо: кликните верхнюю точку', trend: 'Тренд: кликните первую точку' };
                setStatus(drawMode ? hints[drawMode] : '');
            }
        };
    });
    document.getElementById('clear-draw').onclick = () => {
        const all = loadDrawings().filter(d => d.ticker !== currentTicker);
        localStorage.setItem(DRAW_KEY, JSON.stringify(all));
        renderDrawings();
    };

    document.getElementById('sig-toggle').onchange = () => renderSignalMarkers();
    document.getElementById('sr-toggle').onchange = () => renderSR();

    document.querySelectorAll('.panel-tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.panel-body').forEach(b => b.classList.remove('active'));
            document.getElementById(tab.dataset.tab + '-body').classList.add('active');
            if (tab.dataset.tab === 'heatmap') setTimeout(() => { if (!treemapEChart) initTreemap(); updateTreemap(lastPrices); }, 50);
            if (tab.dataset.tab === 'screener') setTimeout(() => { if (!screenerTable) initScreener(); if (screenerTable) { updateScreener(lastPrices); } }, 150);
        };
    });
    document.getElementById('panel-collapse').onclick = () => {
        const p = document.getElementById('bottom-panel');
        p.classList.toggle('collapsed');
        document.getElementById('panel-collapse').innerHTML = p.classList.contains('collapsed') ? '&#9650;' : '&#9660;';
        setTimeout(resizeChart, 250);
    };

    // ---- Chart ----
    function initChart() {
        const container = document.getElementById('chart-container');
        chart = createChart(container, {
            width: container.clientWidth, height: container.clientHeight,
            localization: { locale: 'ru-RU' },
            layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc', panes: { separatorColor: '#2a2e39', enableResize: true } },
            grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
            crosshair: { mode: 0, vertLine: { color: '#758696', width: 1, style: 3, labelBackgroundColor: '#2a2e39' }, horzLine: { color: '#758696', width: 1, style: 3, labelBackgroundColor: '#2a2e39' } },
            rightPriceScale: { borderColor: '#2a2e39', scaleMargins: { top: 0.05, bottom: 0.15 } },
            timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false },
        });

        candleSeries = chart.addSeries(CandlestickSeries, { upColor: '#26a69a', downColor: '#ef5350', borderUpColor: '#26a69a', borderDownColor: '#ef5350', wickUpColor: '#26a69a', wickDownColor: '#ef5350' }, 0);
        volumeSeries = chart.addSeries(HistogramSeries, { priceFormat: { type: 'volume' }, priceScaleId: 'vol' }, 0);
        chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
        sma20Series = chart.addSeries(LineSeries, { color: '#ff9800', lineWidth: 1, priceLineVisible: false, lastValueVisible: false }, 0);
        sma50Series = chart.addSeries(LineSeries, { color: '#2196f3', lineWidth: 1, priceLineVisible: false, lastValueVisible: false }, 0);
        bb1Series = chart.addSeries(LineSeries, { color: 'rgba(156,39,176,0.4)', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false }, 0);
        bb2Series = chart.addSeries(LineSeries, { color: 'rgba(156,39,176,0.4)', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false }, 0);

        rsiSeries = chart.addSeries(LineSeries, { color: '#7c4dff', lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false, autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }) }, 1);
        rsiSeries.createPriceLine({ price: 70, color: '#ef5350', lineWidth: 1, lineStyle: 2, axisLabelVisible: true });
        rsiSeries.createPriceLine({ price: 30, color: '#26a69a', lineWidth: 1, lineStyle: 2, axisLabelVisible: true });
        rsiSeries.createPriceLine({ price: 50, color: '#363a45', lineWidth: 1, lineStyle: 2, axisLabelVisible: false });

        macdLineSrs = chart.addSeries(LineSeries, { color: '#2196f3', lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false }, 2);
        macdSignalSrs = chart.addSeries(LineSeries, { color: '#ff9800', lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false }, 2);
        macdHistSrs = chart.addSeries(HistogramSeries, { priceLineVisible: false, lastValueVisible: false }, 2);
        macdLineSrs.createPriceLine({ price: 0, color: '#363a45', lineWidth: 1, lineStyle: 2, axisLabelVisible: false });

        chart.subscribeCrosshairMove(param => { if (!param.time) return; const d = dataLookup.get(timeKey(param.time)); if (d) updateInfo(d); });
        chart.subscribeClick(param => {
            if (!drawMode || !param.time || !param.point) return;
            const price = candleSeries.coordinateToPrice(param.point.y);
            if (price == null) return;
            const roundP = Math.round(price * 100) / 100;

            if (drawMode === 'hline') {
                saveDrawing({ type: 'hline', price: roundP }); renderDrawings();
                exitDrawMode(`Уровень ${roundP.toFixed(2)} добавлен`);
            } else if (drawMode === 'alert') {
                const last = lastData.length ? lastData[lastData.length-1].close : roundP;
                addAlert(currentTicker, roundP, roundP >= last ? 'above' : 'below');
                requestPermission(); renderAlerts(); renderAlertLines();
                exitDrawMode(`Алерт на ${roundP.toFixed(2)} добавлен`);
            } else if (drawMode === 'fib') {
                if (!pendingPoint) { pendingPoint = { time: param.time, price: roundP }; setStatus('Фибо: кликните нижнюю точку'); }
                else {
                    const hi = Math.max(pendingPoint.price, roundP), lo = Math.min(pendingPoint.price, roundP);
                    saveDrawing({ type: 'fib', high: hi, low: lo }); renderDrawings();
                    exitDrawMode(`Фибоначчи ${lo.toFixed(2)}–${hi.toFixed(2)} добавлен`);
                }
            } else if (drawMode === 'trend') {
                if (!pendingPoint) { pendingPoint = { time: param.time, price: roundP }; setStatus('Тренд: кликните вторую точку'); }
                else {
                    saveDrawing({ type: 'trend', p1: pendingPoint, p2: { time: param.time, price: roundP } });
                    renderDrawings(); exitDrawMode('');
                }
            }
        });
        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'Escape') { if (drawMode) { exitDrawMode('Отменено'); return; } if (document.getElementById('multichart-overlay').classList.contains('show')) { closeMultichart(); return; } }
            if (e.key === 'm' || e.key === 'M') { if (document.getElementById('multichart-overlay').classList.contains('show')) closeMultichart(); else openMultichart(); return; }
            if (e.key >= '1' && e.key <= '6') { const idx = parseInt(e.key) - 1; if (idx < TIMEFRAMES.length) { const btns = tfBar.querySelectorAll('button'); btns.forEach(b => b.classList.remove('active')); btns[idx]?.classList.add('active'); currentTF = TIMEFRAMES[idx]; loadData(); } return; }
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                const idx = TICKERS.indexOf(currentTicker);
                const next = e.key === 'ArrowRight' ? (idx + 1) % TICKERS.length : (idx - 1 + TICKERS.length) % TICKERS.length;
                selectTicker(TICKERS[next]); return;
            }
            const toolMap = { h: 'hline', a: 'alert', f: 'fib', t: 'trend' };
            if (toolMap[e.key]) { document.querySelector(`[data-tool="${toolMap[e.key]}"]`)?.click(); return; }
            if (e.key === 'c' || e.key === 'C') { document.getElementById('clear-draw')?.click(); return; }
        });
        window.addEventListener('resize', resizeChart);
    }

    function resizeChart() { const el = document.getElementById('chart-container'); chart.applyOptions({ width: el.clientWidth, height: el.clientHeight }); }
    function setStatus(t) { if (t) document.getElementById('status').textContent = t; }

    // ---- Helpers ----
    function formatVol(v) {
        if (v >= 1e9) return (v / 1e9).toFixed(1) + 'B';
        if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
        if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
        return v;
    }
    function updateInfo(d) {
        document.getElementById('info-o').textContent = d.open.toFixed(2);
        document.getElementById('info-h').textContent = d.high.toFixed(2);
        document.getElementById('info-l').textContent = d.low.toFixed(2);
        document.getElementById('info-c').textContent = d.close.toFixed(2);
        document.getElementById('info-v').textContent = formatVol(d.volume);
        const r = document.getElementById('info-rsi');
        r.textContent = d.rsi !== undefined ? d.rsi.toFixed(1) : '—';
        r.className = 'val' + (d.rsi > 70 ? ' red' : d.rsi < 30 ? ' green' : '');
        const m = document.getElementById('info-macd');
        m.textContent = d.macd !== undefined ? d.macd.toFixed(2) : '—';
        m.className = 'val' + (d.macdHist > 0 ? ' green' : d.macdHist < 0 ? ' red' : '');
    }

    // ---- Drawings ----
    function loadDrawings() { try { return JSON.parse(localStorage.getItem(DRAW_KEY) || '[]'); } catch { return []; } }
    function saveDrawing(d) { const all = loadDrawings(); all.push({ ...d, ticker: currentTicker }); localStorage.setItem(DRAW_KEY, JSON.stringify(all)); }

    function renderDrawings() {
        drawPriceLines.forEach(l => candleSeries.removePriceLine(l)); drawPriceLines = [];
        drawSeries.forEach(s => chart.removeSeries(s)); drawSeries = [];
        const mine = loadDrawings().filter(d => d.ticker === currentTicker);
        for (const d of mine) {
            if (d.type === 'hline') drawPriceLines.push(candleSeries.createPriceLine({ price: d.price, color: '#d1d4dc', lineWidth: 1, lineStyle: 0, axisLabelVisible: true, title: 'Уровень' }));
            else if (d.type === 'fib') {
                const diff = d.high - d.low;
                [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1].forEach(lv => {
                    drawPriceLines.push(candleSeries.createPriceLine({ price: d.high - diff * lv, color: '#FFD700', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: (lv * 100).toFixed(1) + '%' }));
                });
            }
            else if (d.type === 'trend') {
                const s = chart.addSeries(LineSeries, { color: '#ffffff', lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }, 0);
                const pts = [{ time: d.p1.time, value: d.p1.price }, { time: d.p2.time, value: d.p2.price }].sort((a, b) => (a.time > b.time ? 1 : -1));
                s.setData(pts); drawSeries.push(s);
            }
        }
    }

    // ---- S/R ----
    function renderSR() {
        srLines.forEach(l => candleSeries.removePriceLine(l)); srLines = [];
        if (!document.getElementById('sr-toggle').checked || !lastIndicators.sr) return;
        for (const lv of lastIndicators.sr) {
            srLines.push(candleSeries.createPriceLine({
                price: lv.price, color: lv.type === 'support' ? 'rgba(38,166,154,0.5)' : 'rgba(239,83,80,0.5)',
                lineWidth: 1, lineStyle: 3, axisLabelVisible: true, title: (lv.type === 'support' ? 'S' : 'R') + ' ' + lv.touches,
            }));
        }
    }

    // ---- Signal markers ----
    function renderSignalMarkers() {
        if (!lastIndicators.signals) return;
        const on = document.getElementById('sig-toggle').checked;
        const markers = on ? lastIndicators.signals.map(s => ({
            time: s.time, position: s.type === 'BUY' ? 'belowBar' : 'aboveBar',
            color: s.type === 'BUY' ? '#26a69a' : '#ef5350', shape: s.type === 'BUY' ? 'arrowUp' : 'arrowDown', text: s.type,
        })) : [];
        try {
            if (typeof candleSeries.setMarkers === 'function') candleSeries.setMarkers(markers);
            else if (LightweightCharts.createSeriesMarkers) {
                if (!window._markerPrimitive) window._markerPrimitive = LightweightCharts.createSeriesMarkers(candleSeries, markers);
                else window._markerPrimitive.setMarkers(markers);
            }
        } catch (e) {}
    }

    // ---- Alert lines ----
    function renderAlertLines() {
        alertLines.forEach(l => candleSeries.removePriceLine(l)); alertLines = [];
        loadAlerts().filter(a => a.ticker === currentTicker && a.active).forEach(a => {
            alertLines.push(candleSeries.createPriceLine({ price: a.price, color: '#ffeb3b', lineWidth: 1, lineStyle: 1, axisLabelVisible: true, title: 'Алерт' }));
        });
    }

    // ---- Advisor + Gauge ----
    function initGauge() {
        if (!hasECharts) return;
        const el = document.getElementById('adv-gauge');
        if (!el || el.clientWidth === 0) return;
        gaugeEChart = echarts.init(el, 'dark');
        gaugeEChart.setOption({
            backgroundColor: 'transparent',
            series: [{ type: 'gauge', startAngle: 180, endAngle: 0, min: 0, max: 100, splitNumber: 4,
                radius: '100%', center: ['50%', '75%'],
                axisLine: { lineStyle: { width: 12, color: [[0.3, '#ef5350'], [0.7, '#ff9800'], [1, '#26a69a']] } },
                pointer: { width: 4, length: '55%', itemStyle: { color: '#d1d4dc' } },
                axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false },
                detail: { valueAnimation: true, fontSize: 12, fontWeight: 'bold', offsetCenter: [0, '20%'], color: '#787b86', formatter: v => v >= 70 ? 'ПОКУПКА' : v <= 30 ? 'ПРОДАЖА' : 'ОЖИДАНИЕ' },
                data: [{ value: 50 }]
            }]
        });
    }

    function updateGauge(value) {
        if (!gaugeEChart) return;
        const color = value >= 70 ? '#26a69a' : value <= 30 ? '#ef5350' : '#ff9800';
        gaugeEChart.setOption({ series: [{ data: [{ value }], detail: { color } }] });
    }

    function renderAdvisor() {
        const body = document.getElementById('adv-text');
        if (!lastData.length) { body.innerHTML = '<span class="muted">Нет данных</span>'; updateGauge(50); return; }
        const { sma20, sma50, rsi, macdData, sr, patterns, signals, atr, regime } = lastIndicators;
        const last = lastData[lastData.length - 1];
        const lines = [];
        const cur20 = sma20.length ? sma20[sma20.length-1].value : null;
        const cur50 = sma50.length ? sma50[sma50.length-1].value : null;
        if (cur20 && cur50) lines.push((cur20 > cur50 ? '▲ Тренд восходящий' : '▼ Тренд нисходящий') + ` (SMA20 ${cur20.toFixed(1)} / SMA50 ${cur50.toFixed(1)})`);
        const curRsi = rsi.length ? rsi[rsi.length-1].value : null;
        if (curRsi != null) lines.push(curRsi > 70 ? `RSI перекуплен (${curRsi.toFixed(1)}) — риск коррекции` : curRsi < 30 ? `RSI перепродан (${curRsi.toFixed(1)}) — возможен отскок` : `RSI нейтрально (${curRsi.toFixed(1)})`);
        if (macdData.macd.length) {
            const lm = macdData.macd[macdData.macd.length-1].value, ls = macdData.signal[macdData.signal.length-1].value;
            lines.push(lm > ls ? 'MACD выше сигнальной — бычий' : 'MACD ниже сигнальной — медвежий');
        }
        const recentP = patterns.filter(p => p.idx >= lastData.length - 3);
        if (recentP.length) recentP.forEach(p => lines.push(`${p.dir === 'bull' ? '▲' : p.dir === 'bear' ? '▼' : '◆'} ${p.name} (${p.conf}%)`));
        if (regime && regime.regime !== 'unknown') lines.unshift(`<span style="color:${regime.color}">● ${regime.label}</span>`);

        let html = lines.map(l => `<div class="adv-line">${l}</div>`).join('');
        const lastSig = signals.length ? signals[signals.length - 1] : null;
        let rec = 'neutral', recText = 'НЕЙТРАЛЬНО', entry = last.close, stop = null, target = null;
        let gaugeValue = 50;
        if (lastSig && signals[signals.length-1].time === last.time) {
            rec = lastSig.type === 'BUY' ? 'buy' : 'sell';
            recText = lastSig.type === 'BUY' ? 'ПОКУПКА' : 'ПРОДАЖА';
            const a = atr.length ? atr[atr.length-1].value : last.close * 0.02;
            if (lastSig.type === 'BUY') { stop = entry - a * 2; target = entry + a * 3; gaugeValue = 50 + lastSig.score * 10; }
            else { stop = entry + a * 2; target = entry - a * 3; gaugeValue = 50 - lastSig.score * 10; }
        } else {
            let score = 0;
            if (cur20 && cur50 && cur20 > cur50) score += 10;
            if (cur20 && cur50 && cur20 < cur50) score -= 10;
            if (curRsi != null && curRsi < 35) score += 10;
            if (curRsi != null && curRsi > 65) score -= 10;
            if (macdData.macd.length) { const lm = macdData.macd[macdData.macd.length-1].value, ls = macdData.signal[macdData.signal.length-1].value; if (lm > ls) score += 5; else score -= 5; }
            gaugeValue = Math.max(0, Math.min(100, 50 + score));
        }
        html += `<div class="adv-rec ${rec}"><b class="${rec === 'buy' ? 'green' : rec === 'sell' ? 'red' : 'muted'}">${recText}</b>`;
        if (stop != null) {
            const rr = Math.abs((target - entry) / (stop - entry));
            html += `<div class="adv-line">Вход ${entry.toFixed(2)} · Стоп ${stop.toFixed(2)} · Цель ${target.toFixed(2)} · R/R 1:${rr.toFixed(1)}</div>`;
            if (lastSig.reasons) html += `<div class="adv-line muted">${lastSig.reasons.join(' · ')}</div>`;
        } else {
            html += `<div class="adv-line muted">Цена ${last.close.toFixed(2)}. Ждите подтверждения.</div>`;
        }
        html += '</div>';
        body.innerHTML = html;
        updateGauge(gaugeValue);
    }

    function renderSignalsTable() {
        const body = document.getElementById('signals-body');
        const sigs = (lastIndicators.signals || []).slice(-20).reverse();
        if (!sigs.length) { body.innerHTML = '<span class="muted">Сигналов нет</span>'; return; }
        let html = '<table class="data"><thead><tr><th>Время</th><th>Тип</th><th>Сила</th><th>Цена</th><th>Причины</th></tr></thead><tbody>';
        for (const s of sigs) {
            html += `<tr><td>${timeKey(s.time)}</td><td class="${s.type === 'BUY' ? 'green' : 'red'}">${s.type}</td><td>${s.score}/5</td><td>${s.price.toFixed(2)}</td><td class="muted">${s.reasons.join(', ')}</td></tr>`;
        }
        body.innerHTML = html + '</tbody></table>';
    }

    function renderAlerts() {
        const body = document.getElementById('alerts-body');
        const alerts = loadAlerts();
        if (!alerts.length) { body.innerHTML = '<span class="muted">Алертов нет. Нажмите «Алерт».</span>'; return; }
        let html = '<table class="data"><thead><tr><th>Тикер</th><th>Условие</th><th>Цена</th><th>Статус</th><th></th></tr></thead><tbody>';
        for (const a of alerts) {
            html += `<tr><td>${a.ticker}</td><td>${a.direction === 'above' ? 'выше' : 'ниже'}</td><td>${a.price.toFixed(2)}</td><td class="${a.active ? '' : 'muted'}">${a.active ? 'активен' : 'сработал'}</td><td><button class="del-btn" data-id="${a.id}">✕</button></td></tr>`;
        }
        body.innerHTML = html + '</tbody></table>';
        body.querySelectorAll('.del-btn').forEach(b => b.onclick = () => { removeAlert(Number(b.dataset.id)); renderAlerts(); renderAlertLines(); });
    }

    // ---- Ticker search ----
    const searchInput = document.getElementById('ticker-search');
    const searchResults = document.getElementById('ticker-results');
    let searchTimeout = null;
    searchInput.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        const q = searchInput.value.trim().toUpperCase();
        if (q.length < 2) { searchResults.classList.remove('show'); return; }
        searchTimeout = setTimeout(async () => {
            try {
                const url = `https://iss.moex.com/iss/securities.json?q=${encodeURIComponent(q)}&iss.meta=off&limit=10&engine=stock&market=shares`;
                const resp = await fetch(url);
                if (!resp.ok) return;
                const data = await resp.json();
                const cols = data.securities.columns;
                const ci = (n) => cols.indexOf(n);
                searchResults.innerHTML = '';
                for (const r of data.securities.data) {
                    if (r[ci('is_traded')] !== 1) continue;
                    const div = document.createElement('div');
                    div.className = 'ticker-result';
                    const tk = document.createElement('span'); tk.textContent = r[ci('secid')];
                    const nm = document.createElement('span'); nm.className = 'tr-name'; nm.textContent = r[ci('shortname')] || '';
                    div.append(tk, nm);
                    div.onclick = () => { addTickerToWatchlist(r[ci('secid')]); searchResults.classList.remove('show'); searchInput.value = ''; };
                    searchResults.appendChild(div);
                }
                searchResults.classList.toggle('show', searchResults.children.length > 0);
            } catch {}
        }, 300);
    });
    searchInput.addEventListener('blur', () => setTimeout(() => searchResults.classList.remove('show'), 200));

    function addTickerToWatchlist(ticker) {
        if (!TICKERS.includes(ticker)) {
            TICKERS.push(ticker);
            const btn = document.createElement('button');
            btn.textContent = ticker; btn.dataset.ticker = ticker;
            btn.onclick = () => selectTicker(ticker);
            tickerBar.appendChild(btn);
        }
        selectTicker(ticker);
        refreshWatchlist();
    }

    function removeTickerFromWatchlist(ticker) {
        if (TICKERS.length <= 1) return;
        const idx = TICKERS.indexOf(ticker);
        if (idx === -1) return;
        TICKERS.splice(idx, 1);
        const btn = tickerBar.querySelector(`[data-ticker="${ticker}"]`);
        if (btn) btn.remove();
        if (currentTicker === ticker) selectTicker(TICKERS[0]);
        refreshWatchlist();
    }

    // ---- Overlay ----
    const overlayBtn = document.getElementById('overlay-btn');
    const overlayPanel = document.getElementById('overlay-panel');
    const overlaySearchInput = document.getElementById('overlay-search');
    const overlayResultsEl = document.getElementById('overlay-results');
    const overlayActiveEl = document.getElementById('overlay-active');
    let overlaySearchTimer = null;

    overlayBtn.onclick = () => { overlayPanel.classList.toggle('show'); if (overlayPanel.classList.contains('show')) overlaySearchInput.focus(); };
    document.addEventListener('click', e => { if (!e.target.closest('.overlay-wrap')) overlayPanel.classList.remove('show'); });

    overlaySearchInput.addEventListener('input', () => {
        clearTimeout(overlaySearchTimer);
        const q = overlaySearchInput.value.trim();
        if (q.length < 2) { overlayResultsEl.innerHTML = ''; return; }
        overlaySearchTimer = setTimeout(async () => {
            try {
                const results = await searchSecurities(q);
                overlayResultsEl.innerHTML = '';
                for (const sec of results) {

    // ---- Backtest + Equity Curve ----
    function runBacktest() {
        const statsEl = document.getElementById('bt-stats');
        const signals = lastIndicators.signals || [];
        const data = lastData;
        if (!signals.length || data.length < 20) { statsEl.innerHTML = '<span class="muted">Недостаточно данных для бэктеста</span>'; renderEquityCurve([]); return; }
        const atr = lastIndicators.atr || [];
        const atrMap = new Map();
        for (const a of atr) atrMap.set(timeKey(a.time), a.value);
        const dataMap = new Map();
        for (let i = 0; i < data.length; i++) dataMap.set(timeKey(data[i].time), i);

        let wins = 0, losses = 0, totalPnl = 0, maxDD = 0, equity = 0, peak = 0;
        const trades = [];

        for (const sig of signals) {
            const idx = dataMap.get(timeKey(sig.time));
            if (idx == null || idx + 1 >= data.length) continue;
            const entry = data[idx + 1].open;
            const a = atrMap.get(timeKey(sig.time)) || entry * 0.02;
            const sl = sig.type === 'BUY' ? entry - a * 2 : entry + a * 2;
            const tp = sig.type === 'BUY' ? entry + a * 3 : entry - a * 3;
            let exitPrice = null, exitReason = '';
            for (let j = idx + 1; j < Math.min(idx + 21, data.length); j++) {
                if (sig.type === 'BUY') {
                    if (data[j].low <= sl) { exitPrice = sl; exitReason = 'стоп'; break; }
                    if (data[j].high >= tp) { exitPrice = tp; exitReason = 'цель'; break; }
                } else {
                    if (data[j].high >= sl) { exitPrice = sl; exitReason = 'стоп'; break; }
                    if (data[j].low <= tp) { exitPrice = tp; exitReason = 'цель'; break; }
                }
            }
            if (!exitPrice) { exitPrice = data[Math.min(idx + 20, data.length - 1)].close; exitReason = 'время'; }
            const pnl = sig.type === 'BUY' ? exitPrice - entry : entry - exitPrice;
            const pnlPct = (pnl / entry) * 100;
            if (pnl > 0) wins++; else losses++;
            totalPnl += pnlPct;
            equity += pnlPct;
            if (equity > peak) peak = equity;
            if (peak - equity > maxDD) maxDD = peak - equity;
            trades.push({ type: sig.type, entry: entry.toFixed(2), exit: exitPrice.toFixed(2), pnl: pnlPct.toFixed(2), reason: exitReason, time: sig.time });
        }
        const total = wins + losses;
        const winRate = total ? (wins / total * 100).toFixed(1) : 0;
        const avgPnl = total ? (totalPnl / total).toFixed(2) : 0;
        const grossW = trades.filter(t => parseFloat(t.pnl) > 0).reduce((s, t) => s + parseFloat(t.pnl), 0);
        const grossL = Math.abs(trades.filter(t => parseFloat(t.pnl) < 0).reduce((s, t) => s + parseFloat(t.pnl), 0));
        const pf = grossL > 0 ? (grossW / grossL).toFixed(2) : '∞';

        let html = `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px;">`;
        html += `<span><span class="label">Сделок:</span> <b>${total}</b></span>`;
        html += `<span><span class="label">Win:</span> <b class="${winRate >= 50 ? 'green' : 'red'}">${winRate}%</b></span>`;
        html += `<span><span class="label">PF:</span> <b class="${pf >= 1 ? 'green' : 'red'}">${pf}</b></span>`;
        html += `<span><span class="label">Ср.P&L:</span> <b class="${avgPnl >= 0 ? 'green' : 'red'}">${avgPnl}%</b></span>`;
        html += `<span><span class="label">MaxDD:</span> <b class="red">${maxDD.toFixed(2)}%</b></span>`;
        html += `</div>`;
        html += '<table class="data"><thead><tr><th>Тип</th><th>Вход</th><th>Выход</th><th>P&L%</th><th>Причина</th></tr></thead><tbody>';
        for (const t of trades.slice(-10).reverse()) {
            html += `<tr><td class="${t.type === 'BUY' ? 'green' : 'red'}">${t.type}</td><td>${t.entry}</td><td>${t.exit}</td><td class="${parseFloat(t.pnl) >= 0 ? 'green' : 'red'}">${t.pnl}%</td><td class="muted">${t.reason}</td></tr>`;
        }
        html += '</tbody></table>';
        statsEl.innerHTML = html;
        renderEquityCurve(trades);
    }

    // ---- Watchlist + Sparklines ----
    function drawSparkline(canvas, data) {
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        if (!data || data.length < 2) return;
        const min = Math.min(...data), max = Math.max(...data);
        const range = max - min || 1;
        const color = data[data.length - 1] >= data[0] ? '#26a69a' : '#ef5350';
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        for (let i = 0; i < data.length; i++) {
            const x = (i / (data.length - 1)) * w;
            const y = h - ((data[i] - min) / range) * (h - 4) - 2;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    function updateDepthChart(bids, asks) {
        if (!depthEChart) return;
        if (!bids.length && !asks.length) {
            depthEChart.setOption({ series: [{ data: [] }, { data: [] }] }, true);
            return;
        }
        const bidData = [];
        let cumBid = 0;
        for (const b of bids) { cumBid += b.quantity; bidData.push([b.price, cumBid]); }

        const askData = [];
        let cumAsk = 0;
        for (const a of asks) { cumAsk += a.quantity; askData.push([a.price, cumAsk]); }

        depthEChart.setOption({
            backgroundColor: 'transparent',
            animation: false,
            grid: { top: 8, right: 8, bottom: 22, left: 45 },
            tooltip: { trigger: 'axis', backgroundColor: '#1e222d', borderColor: '#363a45', textStyle: { color: '#d1d4dc', fontSize: 10 } },

    }

    function closeMultichart() {
        document.getElementById('multichart-overlay').classList.remove('show');
        mcCharts.forEach(c => c.chart.remove());
        mcCharts = [];
    }

    // ---- Ticker Tape ----
    function updateTickerTape(prices) {
        const track = document.getElementById('tape-track');
        if (!prices || !prices.length) return;
        track.innerHTML = '';
        const fragment = document.createDocumentFragment();
        for (const p of prices) {
            const item = document.createElement('span'); item.className = 'tape-item';
            const ticker = document.createElement('span'); ticker.className = 'tape-ticker'; ticker.textContent = p.ticker;
            const price = document.createElement('span'); price.className = 'tape-price'; price.textContent = p.last.toFixed(2);
            const change = document.createElement('span'); change.className = 'tape-change';
            const chg = p.change != null ? parseFloat(p.change) : 0;
            change.style.color = chg >= 0 ? '#26a69a' : '#ef5350';
            change.textContent = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
            item.append(ticker, price, change);
            fragment.appendChild(item);
        }
        track.appendChild(fragment);
        const clone = track.innerHTML;
        track.innerHTML += clone;
    }

    // ---- Heatmap / Treemap (ECharts) ----
    function initTreemap() {
        if (!hasECharts) return;
        const el = document.getElementById('heatmap-container');
        if (!el) return;
        treemapEChart = echarts.init(el, 'dark');
        treemapEChart.setOption({ backgroundColor: 'transparent' });
    }

    function updateTreemap(prices) {
        if (!treemapEChart || !prices || !prices.length) return;
        const data = prices.map(p => {
            const chg = p.change != null ? parseFloat(p.change) : 0;
            let color;
            if (chg > 2) color = '#1b8a6b';
            else if (chg > 0.5) color = '#2e7d6f';
            else if (chg > -0.5) color = '#4a4a5a';
            else if (chg > -2) color = '#8b3a3a';
            else color = '#c0392b';
            return {
                name: p.ticker,
                value: Math.max(p.volume || 1, 1),
                label: { formatter: `${p.ticker}\n${(chg >= 0 ? '+' : '') + chg.toFixed(2)}%` },
                itemStyle: { color, borderColor: '#131722', borderWidth: 2 }
            };
        });
        treemapEChart.setOption({
            backgroundColor: 'transparent',
            tooltip: { formatter: params => `<b>${params.name}</b><br/>Объём: ${formatVol(params.value)}` },
            series: [{
                type: 'treemap', data, roam: false, nodeClick: false, width: '100%', height: '100%',
                breadcrumb: { show: false },
                label: { show: true, color: '#fff', fontSize: 12, fontWeight: 'bold' },
                levels: [{ itemStyle: { borderWidth: 0, gapWidth: 2 } }],
            }]
        }, true);
    }

    // ---- Screener (Tabulator) ----
    function initScreener() {
        if (!hasTabulator) return;
        const el = document.getElementById('screener-table');
        if (!el) return;
        const data = (lastPrices || []).map(p => ({
            ticker: p.ticker, shortname: p.shortname, last: p.last,
            change: p.change != null ? parseFloat(p.change) : 0,
            volume: p.volume || 0, time: p.time || '',
        }));
        screenerTable = new Tabulator('#screener-table', {
            layout: 'fitColumns',
            data,
            columns: [
                { title: 'Тикер', field: 'ticker', width: 70 },
                { title: 'Имя', field: 'shortname', minWidth: 80 },
                { title: 'Цена', field: 'last', hozAlign: 'right', width: 80,
                    formatter: function(cell) { return cell.getValue()?.toFixed(2) || '—'; } },
                { title: 'Изм.%', field: 'change', hozAlign: 'right', width: 75,
                    formatter: function(cell) {
                        const v = cell.getValue();
                        cell.getElement().style.color = v >= 0 ? '#26a69a' : '#ef5350';
                        return (v >= 0 ? '+' : '') + (v != null ? v.toFixed(2) : '0.00') + '%';
                    }
                },
                { title: 'Объём', field: 'volume', hozAlign: 'right', width: 85,
                    formatter: function(cell) { return formatVol(cell.getValue()); } },
                { title: 'Время', field: 'time', hozAlign: 'center', width: 70 },
            ],
        });
    }

    function updateScreener(prices) {
        if (!screenerTable || !prices) return;
        screenerTable.replaceData(prices.map(p => ({
            ticker: p.ticker, shortname: p.shortname, last: p.last,
            change: p.change != null ? parseFloat(p.change) : 0,
            volume: p.volume || 0, time: p.time || '',
        })));
    }

    // ---- Init ----
    initChart();
    initDepthChart();
    setTimeout(initGauge, 100);
    loadData();
    refreshWatchlist();
    setTimeout(fetchSparkData, 3000);
    setInterval(refreshWatchlist, 60000);
    setInterval(() => { if (!document.getElementById('orderbook').classList.contains('collapsed')) refreshOrderBook(); }, 30000);
    setInterval(fetchSparkData, 300000);
    </script>
</body>
</html>
