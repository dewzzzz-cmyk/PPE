    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #d1d4dc; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        .ticker-tape { background: linear-gradient(90deg, #0d1117 0%, #131a2a 50%, #0d1117 100%); border-bottom: 1px solid #1e2a3a; overflow: hidden; height: 34px; position: relative; flex-shrink: 0; }

        .wl-body { flex: 1; overflow-y: auto; }
        .wl-body::-webkit-scrollbar, .ob-body::-webkit-scrollbar { width: 3px; }

        .wl-item { display: flex; align-items: center; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid rgba(30,42,58,0.4); gap: 6px; transition: all 0.2s ease; position: relative; }
        .wl-item:hover { background: rgba(41,98,255,0.06); }
        .wl-item.active { background: linear-gradient(90deg, rgba(41,98,255,0.15) 0%, rgba(41,98,255,0.05) 100%); border-left: 3px solid #2962ff; padding-left: 9px; box-shadow: inset 0 0 20px rgba(41,98,255,0.05); }
        .wl-info { flex: 1; min-width: 0; }

        .wl-change.down { background: rgba(239,83,80,0.12); color: #ef5350; }
        .wl-volbar { position: absolute; bottom: 0; left: 0; height: 2px; background: linear-gradient(90deg, #2962ff60, #2962ff00); transition: width 0.5s ease; }

        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        .toolbar { display: flex; align-items: center; gap: 6px; padding: 5px 12px; background: linear-gradient(180deg, #141b2d 0%, #111827 100%); border-bottom: 1px solid #1e2a3a; flex-shrink: 0; flex-wrap: wrap; }
        .toolbar h1 { font-size: 15px; font-weight: 800; background: linear-gradient(135deg, #2962ff, #00bcd4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 1px; }
        .icon-btn { background: rgba(41,98,255,0.05); border: 1px solid #1e2a3a; color: #8b95a5; padding: 3px 9px; border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1.4; transition: all 0.2s ease; }

        .tickers button:hover { background: #1e2a3a; border-color: #2962ff40; }
        .tickers button.active { background: linear-gradient(135deg, #1a3a8f, #2962ff); border-color: #2962ff; color: #fff; box-shadow: 0 2px 12px rgba(41,98,255,0.3); font-weight: 700; }
        .timeframes { display: flex; gap: 2px; }

        .timeframes button:hover { color: #d1d4dc; background: rgba(255,255,255,0.03); }
        .timeframes button.active { color: #2962ff; background: rgba(41,98,255,0.12); font-weight: 700; }
        .vsep { width: 1px; height: 20px; background: linear-gradient(180deg, transparent, #1e2a3a, transparent); margin: 0 4px; }

        .info-bar { display: flex; align-items: center; gap: 14px; padding: 6px 14px; background: linear-gradient(180deg, #111827 0%, #0f1520 100%); border-bottom: 1px solid #1e2a3a; font-size: 12px; flex-shrink: 0; flex-wrap: wrap; }

        .info-bar .label { color: #4b5563; font-weight: 500; }

        .delay-badge { background: rgba(255,152,0,0.1); color: #f59e0b; font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(255,152,0,0.2); margin-left: auto; font-weight: 500; }
        .ticker-search-wrap { position: relative; }
        #ticker-search { background: #151d2e; border: 1px solid #1e2a3a; color: #d1d4dc; padding: 4px 10px; border-radius: 6px; font-size: 12px; width: 140px; outline: none; transition: all 0.2s ease; }
        #ticker-search:focus { border-color: #2962ff; box-shadow: 0 0 12px rgba(41,98,255,0.15); }
        .ticker-results { position: absolute; top: 100%; left: 0; background: #151d2e; border: 1px solid #1e2a3a; border-radius: 6px; max-height: 200px; overflow-y: auto; z-index: 100; width: 220px; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .ticker-results.show { display: block; }
        .ticker-result { padding: 6px 12px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; transition: background 0.15s; }
        .ticker-result:hover { background: rgba(41,98,255,0.08); }
        .ticker-result .tr-name { color: #6b7280; font-size: 11px; }
        .wl-item .wl-del { display: none; background: none; border: none; color: #ef5350; cursor: pointer; font-size: 14px; padding: 0 4px; line-height: 1; }
        .wl-item:hover .wl-del { display: block; }
        .regime-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid; margin-left: 6px; font-weight: 600; }
        .green { color: #26a69a; }
        .red { color: #ef5350; }

        #chart-container { flex: 1; min-height: 0; position: relative; }

        .bottom-panel { height: 190px; background: linear-gradient(180deg, #111827 0%, #0d1117 100%); border-top: 1px solid #1e2a3a; display: flex; flex-direction: column; flex-shrink: 0; transition: height 0.3s ease; }
        .bottom-panel.collapsed { height: 28px; }
        .panel-tabs { display: flex; background: linear-gradient(180deg, #141b2d 0%, #111827 100%); flex-shrink: 0; gap: 2px; padding: 0 4px; }
        .panel-tab { background: none; border: none; color: #6b7280; padding: 6px 14px; cursor: pointer; font-size: 11px; font-weight: 600; border-bottom: 2px solid transparent; transition: all 0.2s ease; letter-spacing: 0.3px; }
        .panel-tab:hover { color: #d1d4dc; background: rgba(255,255,255,0.02); }
        .panel-tab.active { color: #e1e4ec; border-bottom-color: #2962ff; background: rgba(41,98,255,0.05); }
        .panel-collapse { margin-left: auto; background: none; border: none; color: #6b7280; cursor: pointer; padding: 6px 12px; font-size: 12px; }
        .panel-body { flex: 1; overflow-y: auto; padding: 10px 14px; font-size: 12px; display: none; }
        .panel-body.active { display: block; }
        .panel-body::-webkit-scrollbar { width: 3px; }
        .panel-body::-webkit-scrollbar-thumb { background: #2962ff40; border-radius: 3px; }

        .adv-wrap { display: flex; gap: 16px; height: 100%; }
        #adv-text { flex: 1; min-width: 0; }
        #adv-gauge { width: 200px; height: 140px; flex-shrink: 0; }

        .adv-rec.buy { border-left: 3px solid #26a69a; box-shadow: inset 0 0 30px rgba(38,166,154,0.05); }
        .adv-rec.sell { border-left: 3px solid #ef5350; box-shadow: inset 0 0 30px rgba(239,83,80,0.05); }
        .adv-rec.neutral { border-left: 3px solid #4b5563; }

        table.data { width: 100%; border-collapse: collapse; font-size: 11px; }
        table.data th { text-align: left; color: #4b5563; font-weight: 600; padding: 4px 10px; border-bottom: 1px solid #1e2a3a; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
        table.data td { padding: 4px 10px; border-bottom: 1px solid rgba(30,42,58,0.3); }
        table.data tr:hover { background: rgba(41,98,255,0.03); }
        .del-btn { background: none; border: none; color: #ef5350; cursor: pointer; font-size: 12px; opacity: 0.7; transition: opacity 0.2s; }
        .del-btn:hover { opacity: 1; }

        #bt-stats { margin-bottom: 6px; }
        #bt-stats b { font-size: 13px; }
        #equity-chart { height: 100px; width: 100%; border-radius: 4px; overflow: hidden; }

        #heatmap-container { width: 100%; height: 100%; min-height: 130px; }
        #screener-table { height: 100%; }

        .status-bar { padding: 4px 14px; font-size: 11px; color: #4b5563; background: linear-gradient(90deg, #0d1117, #111827); border-top: 1px solid #1e2a3a; flex-shrink: 0; }

        .orderbook { width: 240px; background: linear-gradient(180deg, #111827 0%, #0f1520 100%); border-left: 1px solid #1e2a3a; display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.3s ease; overflow: hidden; }
        .orderbook.collapsed { width: 0; border-left: none; }
        #depth-chart { height: 180px; flex-shrink: 0; border-bottom: 1px solid #1e2a3a; }
        .ob-body { flex: 1; overflow-y: auto; }
        .ob-row { position: relative; display: flex; justify-content: space-between; padding: 3px 10px; font-size: 11px; transition: background 0.15s; }
        .ob-row:hover { background: rgba(255,255,255,0.02); }
        .ob-bar { position: absolute; top: 0; bottom: 0; right: 0; opacity: 0.12; }
        .ob-row.ask .ob-bar { background: linear-gradient(90deg, transparent, #ef5350); }
        .ob-row.bid .ob-bar { background: linear-gradient(90deg, transparent, #26a69a); }
        .ob-row.ask .ob-price { color: #ef5350; font-weight: 600; }
        .ob-row.bid .ob-price { color: #26a69a; font-weight: 600; }
        .ob-price, .ob-vol { z-index: 1; }
        .ob-vol { color: #6b7280; }
        .ob-spread { padding: 6px 10px; font-size: 11px; color: #6b7280; text-align: center; border-top: 1px solid #1e2a3a; border-bottom: 1px solid #1e2a3a; background: rgba(15,21,32,0.8); font-weight: 600; }

        .overlay-wrap { position: relative; }
        .overlay-panel { display: none; position: absolute; top: 100%; right: 0; background: #151d2e; border: 1px solid #1e2a3a; border-radius: 8px; padding: 10px; z-index: 100; width: 280px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
        .overlay-panel.show { display: block; }
        #overlay-search { background: #111827; border: 1px solid #1e2a3a; color: #d1d4dc; padding: 5px 10px; border-radius: 6px; font-size: 12px; width: 100%; outline: none; margin-bottom: 6px; }
        #overlay-search:focus { border-color: #2962ff; box-shadow: 0 0 8px rgba(41,98,255,0.15); }
        .overlay-results { max-height: 150px; overflow-y: auto; }
        .overlay-result { padding: 5px 10px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; border-radius: 4px; transition: background 0.15s; }
        .overlay-result:hover { background: rgba(41,98,255,0.08); }
        .overlay-result .or-info { color: #6b7280; font-size: 10px; }
        .overlay-active { margin-top: 6px; border-top: 1px solid #1e2a3a; padding-top: 6px; }
        .overlay-tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 5px; font-size: 11px; margin: 2px; background: rgba(41,98,255,0.08); border: 1px solid rgba(41,98,255,0.15); font-weight: 500; }
        .overlay-tag .ot-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
        .overlay-tag .ot-remove { cursor: pointer; color: #ef5350; font-size: 13px; margin-left: 4px; }

        .multichart-overlay { display: none; position: fixed; inset: 0; background: #0a0e17; z-index: 200; }

        .mc-header { display: flex; align-items: center; padding: 8px 16px; background: linear-gradient(180deg, #141b2d 0%, #111827 100%); border-bottom: 1px solid #1e2a3a; gap: 12px; }

        .mc-close:hover { background: rgba(239,83,80,0.15); }
        .mc-grid { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .mc-row { display: flex; flex: 1; min-height: 0; }
        .mc-cell { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; background: #0f1520; }
        .mc-cell-header { padding: 6px 12px; font-size: 13px; font-weight: 700; background: linear-gradient(180deg, #141b2d 0%, #111827 100%); border-bottom: 1px solid #1e2a3a; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s ease; }
        .mc-cell-header:hover { color: #2962ff; background: rgba(41,98,255,0.05); }
        .mc-cell-header .mc-price { font-weight: 500; font-size: 12px; }
        .mc-chart { flex: 1; min-height: 0; }
        .gutter { background: #1e2a3a; background-repeat: no-repeat; background-position: 50%; }
        .gutter.gutter-horizontal { cursor: col-resize; background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="2" height="20"><rect fill="%232962ff40" width="2" height="20" rx="1"/></svg>'); }
        .gutter.gutter-vertical { cursor: row-resize; background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="2"><rect fill="%232962ff40" width="20" height="2" rx="1"/></svg>'); }

        #chart-container.draw-active { cursor: crosshair; }

        @keyframes drawPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        #status.draw-active { color: #2962ff; }

        /* Drawing toolbar dropdown */
        .draw-wrap { position: relative; }
        .draw-panel { display: none; position: absolute; top: 100%; left: 0; background: #151d2e; border: 1px solid #1e2a3a; border-radius: 8px; padding: 8px; z-index: 120; width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); max-height: 70vh; overflow-y: auto; }

        .range-lo { color: #ef5350; } .range-hi { color: #26a69a; }

        /* Watchlist sort + header */

        .wl-sort { display: flex; gap: 2px; }

        .wl-sort button:hover { color: #d1d4dc; }
        .wl-sort button.active { color: #2962ff; background: rgba(41,98,255,0.12); border-color: #2962ff40; }
        .wl-add { background: rgba(41,98,255,0.1); border: 1px solid #2962ff40; color: #2962ff; cursor: pointer; font-size: 13px; padding: 0 6px; border-radius: 4px; line-height: 1.4; }

        @media (max-width: 768px) {
            .ticker-tape { height: 28px; }

            .watchlist { width: 0; border-right: none; }
            .watchlist:not(.collapsed) { width: 180px; position: absolute; z-index: 50; height: 100%; }
            .orderbook { width: 0; border-left: none; }
            .orderbook:not(.collapsed) { width: 180px; position: absolute; right: 0; z-index: 50; height: 100%; }
            .tickers { display: none; }
            .toolbar { gap: 4px; padding: 4px 8px; }
            .icon-btn { padding: 3px 6px; font-size: 11px; }
            .info-bar { gap: 8px; padding: 4px 10px; font-size: 11px; }
            .info-bar .ticker-name { font-size: 14px; }
            .info-bar .price { font-size: 13px; }
            #ticker-search { width: 100px; font-size: 11px; }
            .bottom-panel { height: 140px; }
            .vsep { display: none; }
        }
    </style>
</head>
<body>
    <div class="ticker-tape" id="ticker-tape"><div class="tape-track" id="tape-track"></div></div>
    <div class="app">
        <aside class="watchlist" id="watchlist">
            <div class="side-header"><div class="wl-header-row"><span>Вотчлист</span><div class="wl-sort"><button data-sort="default" class="active" title="По умолчанию">•</button><button data-sort="change" title="По изменению">%</button><button data-sort="volume" title="По объёму">Vol</button></div></div></div>
            <div class="wl-body" id="wl-body"></div>
        </aside>
        <div class="main">
            <div class="toolbar">
                <button class="icon-btn" id="wl-toggle" title="Вотчлист">&#9776;</button>
                <h1>MOEX</h1>
                <div class="ticker-search-wrap"><input type="text" id="ticker-search" placeholder="Поиск тикера..." autocomplete="off"><div class="ticker-results" id="ticker-results"></div></div>
                <div class="tickers" id="ticker-bar"></div>
                <div class="vsep"></div>
                <div class="timeframes" id="tf-bar"></div>
                <div class="vsep"></div>
                <div class="draw-wrap">
                    <button class="icon-btn" id="draw-btn" title="Инструменты рисования">&#9998; Рисование</button>
                    <div class="draw-panel" id="draw-panel"></div>
                </div>
                <button class="icon-btn" data-tool="alert" title="Алерт по цене">&#128276; Алерт</button>
                <button class="icon-btn" id="clear-draw" title="Очистить рисунки">Очистить</button>
                <div class="vsep"></div>
                <label class="toggle-lbl"><input type="checkbox" id="sig-toggle" checked> Сигналы</label>
                <label class="toggle-lbl"><input type="checkbox" id="sr-toggle" checked> S/R</label>
                <div class="vsep"></div>
                <div class="overlay-wrap">
                    <button class="icon-btn" id="overlay-btn" title="Оверлей">Оверлей</button>
                    <div class="overlay-panel" id="overlay-panel">
                        <input type="text" id="overlay-search" placeholder="USD, Brent, IMOEX..." autocomplete="off">
                        <div class="overlay-results" id="overlay-results"></div>
                        <div class="overlay-active" id="overlay-active"></div>
                    </div>
                </div>
                <button class="icon-btn" id="multichart-btn" title="Мультичарт 2x2">2x2</button>
                <button class="icon-btn" id="ob-toggle" title="Глубина рынка">Стакан</button>
            </div>
            <div class="info-bar">
                <span class="ticker-name" id="info-ticker">SBER</span>
                <span class="price" id="info-price">&mdash;</span>
                <span class="change" id="info-change">&mdash;</span>
                <span><span class="label">O</span><span class="val" id="info-o">&mdash;</span></span>
                <span><span class="label">H</span><span class="val" id="info-h">&mdash;</span></span>
                <span><span class="label">L</span><span class="val" id="info-l">&mdash;</span></span>
                <span><span class="label">C</span><span class="val" id="info-c">&mdash;</span></span>
                <span><span class="label">Vol</span><span class="val" id="info-v">&mdash;</span></span>
                <span class="range-bar" id="range-bar" style="display:none"><span class="range-lo" id="range-lo">&mdash;</span><span class="range-track"><span class="range-dot" id="range-dot"></span></span><span class="range-hi" id="range-hi">&mdash;</span></span>
                <span class="sep">|</span>
                <span><span class="label">RSI</span><span class="val" id="info-rsi">&mdash;</span></span>
                <span><span class="label">MACD</span><span class="val" id="info-macd">&mdash;</span></span>
                <span class="regime-badge" id="regime-badge" style="display:none"></span>
                <span class="delay-badge">~15 мин</span>
            </div>
            <div id="chart-container"><div class="cross-tip" id="cross-tip"></div></div>
            <div class="bottom-panel" id="bottom-panel">
                <div class="panel-tabs">
                    <button class="panel-tab active" data-tab="advisor">Советник</button>
                    <button class="panel-tab" data-tab="signals">Сигналы</button>
                    <button class="panel-tab" data-tab="alerts">Алерты</button>
                    <button class="panel-tab" data-tab="backtest">Бэктест</button>
                    <button class="panel-tab" data-tab="heatmap">Хитмэп</button>
                    <button class="panel-tab" data-tab="screener">Скринер</button>
                    <button class="panel-collapse" id="panel-collapse" title="Свернуть">&#9660;</button>
                </div>
                <div class="panel-body active" id="advisor-body"><div class="adv-wrap"><div id="adv-text"></div><div id="adv-gauge"></div></div></div>
                <div class="panel-body" id="signals-body"></div>
                <div class="panel-body" id="alerts-body"></div>
                <div class="panel-body" id="backtest-body"><div id="bt-stats"></div><div id="equity-chart"></div></div>
                <div class="panel-body" id="heatmap-body"><div id="heatmap-container"></div></div>
                <div class="panel-body" id="screener-body"><div id="screener-table"></div></div>
            </div>
            <div class="status-bar" id="status">Загрузка...</div>
        </div>
        <aside class="orderbook collapsed" id="orderbook">
            <div class="side-header">Глубина рынка</div>
            <div id="depth-chart"></div>
            <div class="ob-body" id="ob-body"></div>
        </aside>
    </div>
    <div class="multichart-overlay" id="multichart-overlay">
        <div class="mc-header"><h2>Мультичарт</h2><button class="mc-close" id="mc-close">Закрыть (Esc)</button></div>
        <div class="mc-grid" id="mc-grid"></div>
    </div>

    <script type="module">
    import { calcSMA, calcBB, calcRSI, calcMACD, calcATR, detectPatterns, findSR, generateSignals, detectRegime, timeKey } from './js/indicators.js';
    import { fetchCandles, fetchPrices, fetchOrderBook, fetchOverlayCandles, searchSecurities } from './js/moex.js';
    import { loadAlerts, addAlert, removeAlert, checkAlerts, requestPermission } from './js/alerts.js';

    const { createChart, CandlestickSeries, LineSeries, HistogramSeries } = LightweightCharts;
    const createTextWatermark = LightweightCharts.createTextWatermark;
    const DRAW_KEY = 'moex_drawings_v2';
    const hasECharts = typeof echarts !== 'undefined';
    const hasSplit = typeof Split !== 'undefined';
    const hasTabulator = typeof Tabulator !== 'undefined';
    const hasDrawing = typeof LightweightChartsDrawing !== 'undefined';

    const TICKERS = ['SBER','GAZP','LKOH','YNDX','GMKN','ROSN','NVTK','MTSS','MGNT','PLZL'];
    const TIMEFRAMES = [
        { label: '1м', interval: 1, days: 1 },
        { label: '10м', interval: 10, days: 5 },
        { label: '1ч', interval: 60, days: 90 },
        { label: '1д', interval: 24, days: 365 },
        { label: '1н', interval: 7, days: 730 },
        { label: '1мес', interval: 31, days: 1825 },
    ];

    const OVERLAY_COLORS = ['#e040fb', '#00e5ff', '#ffab40', '#69f0ae', '#ff5252'];
    let overlayItems = [];
    let overlaySeries = {};

    let currentTicker = 'SBER', currentTF = TIMEFRAMES[2];
    let dataLookup = new Map();
    let lastData = [], lastIndicators = {};
    let chart;
    let candleSeries, volumeSeries, sma20Series, sma50Series, bb1Series, bb2Series;
    let rsiSeries, macdLineSrs, macdSignalSrs, macdHistSrs;
    let srLines = [], alertLines = [];
    let depthEChart = null, gaugeEChart = null, treemapEChart = null, equityChart = null;
    let screenerTable = null;
    const sparkCache = {};
    let lastPrices = [];
    let wlSort = 'default';

    // Drawing tools (lightweight-charts-drawing)
    let drawManager = null, toolRegistry = null;
    let activeDrawTool = null, pendingAnchors = [], alertMode = false;
    let watermark = null;

    function exitDrawMode(msg) {
        activeDrawTool = null; pendingAnchors = []; alertMode = false;
        if (drawManager) drawManager.setActiveTool(null);
        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.draw-tool').forEach(b => b.classList.remove('active'));
        const drawBtn = document.getElementById('draw-btn');
        drawBtn.classList.remove('active');
        drawBtn.title = 'Инструменты рисования';
        document.getElementById('chart-container').classList.remove('draw-active');
        document.getElementById('status').classList.remove('draw-active');
        if (msg) setStatus(msg);
    }

    // ---- UI ----
    document.getElementById('wl-toggle').onclick = () => { document.getElementById('watchlist').classList.toggle('collapsed'); setTimeout(resizeChart, 250); };
    document.getElementById('ob-toggle').onclick = () => { const o = document.getElementById('orderbook'); o.classList.toggle('collapsed'); if (!o.classList.contains('collapsed')) refreshOrderBook(); setTimeout(resizeChart, 250); };

    const tickerBar = document.getElementById('ticker-bar');
    TICKERS.forEach((t, i) => {
        const btn = document.createElement('button');
        btn.textContent = t; btn.dataset.ticker = t;
        if (i === 0) btn.classList.add('active');
        btn.onclick = () => selectTicker(t);
        tickerBar.appendChild(btn);
    });

    const tfBar = document.getElementById('tf-bar');
    TIMEFRAMES.forEach((tf, i) => {
        const btn = document.createElement('button');
        btn.textContent = tf.label;
        if (i === 2) btn.classList.add('active');
        btn.onclick = () => { tfBar.querySelectorAll('button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentTF = tf; loadData(); };
        tfBar.appendChild(btn);
    });

    function selectTicker(t) {
        currentTicker = t;
        tickerBar.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.ticker === t));
        document.querySelectorAll('.wl-item').forEach(el => el.classList.toggle('active', el.dataset.ticker === t));
        loadData();
        if (!document.getElementById('orderbook').classList.contains('collapsed')) refreshOrderBook();
    }

    // Alert tool (price alert, not a drawing)
    document.querySelector('[data-tool="alert"]').onclick = () => {
        if (alertMode) { exitDrawMode(''); return; }
        exitDrawMode('');
        alertMode = true;
        document.querySelector('[data-tool="alert"]').classList.add('active');
        document.getElementById('chart-container').classList.add('draw-active');
        setStatus('Алерт: кликните на графике на нужной цене');
    };
    document.getElementById('clear-draw').onclick = () => {
        if (drawManager) drawManager.clearAll();
        saveDrawings();
        setStatus('Рисунки очищены');
    };

    document.getElementById('sig-toggle').onchange = () => renderSignalMarkers();
    document.getElementById('sr-toggle').onchange = () => renderSR();

    document.getElementById('draw-btn').onclick = (e) => { e.stopPropagation(); document.getElementById('draw-panel').classList.toggle('show'); };
    document.addEventListener('click', e => { if (!e.target.closest('.draw-wrap')) document.getElementById('draw-panel').classList.remove('show'); });

    // Watchlist sorting
    document.querySelectorAll('.wl-sort button').forEach(btn => {
        btn.onclick = () => {
            wlSort = btn.dataset.sort;
            document.querySelectorAll('.wl-sort button').forEach(b => b.classList.toggle('active', b === btn));
            renderWatchlist();
        };
    });

    document.querySelectorAll('.panel-tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.panel-body').forEach(b => b.classList.remove('active'));
            document.getElementById(tab.dataset.tab + '-body').classList.add('active');
            if (tab.dataset.tab === 'heatmap') setTimeout(() => { if (!treemapEChart) initTreemap(); updateTreemap(lastPrices); }, 50);
            if (tab.dataset.tab === 'screener') setTimeout(() => { if (!screenerTable) initScreener(); if (screenerTable) { updateScreener(lastPrices); } }, 150);
        };
    });
    document.getElementById('panel-collapse').onclick = () => {
        const p = document.getElementById('bottom-panel');
        p.classList.toggle('collapsed');
        document.getElementById('panel-collapse').innerHTML = p.classList.contains('collapsed') ? '&#9650;' : '&#9660;';
        setTimeout(resizeChart, 250);
    };

    // ---- Chart ----
    function initChart() {
        const container = document.getElementById('chart-container');
        chart = createChart(container, {
            width: container.clientWidth, height: container.clientHeight,
            localization: { locale: 'ru-RU' },
            layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc', panes: { separatorColor: '#2a2e39', enableResize: true } },
            grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
            crosshair: { mode: 0, vertLine: { color: '#758696', width: 1, style: 3, labelBackgroundColor: '#2a2e39' }, horzLine: { color: '#758696', width: 1, style: 3, labelBackgroundColor: '#2a2e39' } },
            rightPriceScale: { borderColor: '#2a2e39', scaleMargins: { top: 0.05, bottom: 0.15 } },
            timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false },
        });

        candleSeries = chart.addSeries(CandlestickSeries, { upColor: '#26a69a', downColor: '#ef5350', borderUpColor: '#26a69a', borderDownColor: '#ef5350', wickUpColor: '#26a69a', wickDownColor: '#ef5350' }, 0);
        volumeSeries = chart.addSeries(HistogramSeries, { priceFormat: { type: 'volume' }, priceScaleId: 'vol' }, 0);
        chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
        sma20Series = chart.addSeries(LineSeries, { color: '#ff9800', lineWidth: 1, priceLineVisible: false, lastValueVisible: false }, 0);
        sma50Series = chart.addSeries(LineSeries, { color: '#2196f3', lineWidth: 1, priceLineVisible: false, lastValueVisible: false }, 0);
        bb1Series = chart.addSeries(LineSeries, { color: 'rgba(156,39,176,0.4)', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false }, 0);
        bb2Series = chart.addSeries(LineSeries, { color: 'rgba(156,39,176,0.4)', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false }, 0);

        rsiSeries = chart.addSeries(LineSeries, { color: '#7c4dff', lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false, autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }) }, 1);
        rsiSeries.createPriceLine({ price: 70, color: '#ef5350', lineWidth: 1, lineStyle: 2, axisLabelVisible: true });
        rsiSeries.createPriceLine({ price: 30, color: '#26a69a', lineWidth: 1, lineStyle: 2, axisLabelVisible: true });
        rsiSeries.createPriceLine({ price: 50, color: '#363a45', lineWidth: 1, lineStyle: 2, axisLabelVisible: false });

        macdLineSrs = chart.addSeries(LineSeries, { color: '#2196f3', lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false }, 2);
        macdSignalSrs = chart.addSeries(LineSeries, { color: '#ff9800', lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false }, 2);
        macdHistSrs = chart.addSeries(HistogramSeries, { priceLineVisible: false, lastValueVisible: false }, 2);
        macdLineSrs.createPriceLine({ price: 0, color: '#363a45', lineWidth: 1, lineStyle: 2, axisLabelVisible: false });

        chart.subscribeCrosshairMove(param => {
            const tip = document.getElementById('cross-tip');
            if (!param.time || !param.point) { tip.classList.remove('show'); return; }
            const d = dataLookup.get(timeKey(param.time));
            if (d) { updateInfo(d); showCrossTip(d, param.point); } else tip.classList.remove('show');
        });
        document.getElementById('chart-container').addEventListener('mouseleave', () => document.getElementById('cross-tip').classList.remove('show'));
        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'Escape') { if (activeDrawTool || alertMode) { exitDrawMode('Отменено'); return; } if (drawManager && drawManager.getSelectedDrawing()) { drawManager.deselectAll(); return; } if (document.getElementById('multichart-overlay').classList.contains('show')) { closeMultichart(); return; } }
            if ((e.key === 'Delete' || e.key === 'Backspace') && drawManager) { const sel = drawManager.getSelectedDrawing(); if (sel) { drawManager.removeDrawing(sel.id); saveDrawings(); setStatus('Объект удалён'); return; } }
            if (e.key === 'm' || e.key === 'M') { if (document.getElementById('multichart-overlay').classList.contains('show')) closeMultichart(); else openMultichart(); return; }
            if (e.key >= '1' && e.key <= '6') { const idx = parseInt(e.key) - 1; if (idx < TIMEFRAMES.length) { const btns = tfBar.querySelectorAll('button'); btns.forEach(b => b.classList.remove('active')); btns[idx]?.classList.add('active'); currentTF = TIMEFRAMES[idx]; loadData(); } return; }
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                const idx = TICKERS.indexOf(currentTicker);
                const next = e.key === 'ArrowRight' ? (idx + 1) % TICKERS.length : (idx - 1 + TICKERS.length) % TICKERS.length;
                selectTicker(TICKERS[next]); return;
            }
            const toolMap = { t: 'trend-line', h: 'horizontal-line', f: 'fib-retracement', r: 'rectangle', b: 'brush', v: 'vertical-line' };
            if (toolMap[e.key]) { activateDrawTool(toolMap[e.key]); return; }
            if (e.key === 'a' || e.key === 'A') { document.querySelector('[data-tool="alert"]')?.click(); return; }
            if (e.key === 'c' || e.key === 'C') { document.getElementById('clear-draw')?.click(); return; }
        });
        window.addEventListener('resize', resizeChart);
    }

    function updateWatermark() {
        if (!createTextWatermark || !chart.panes) return;
        try {
            const pane = chart.panes()[0];
            if (!pane) return;
            if (!watermark) watermark = createTextWatermark(pane, {});
            watermark.applyOptions({
                horzAlign: 'center', vertAlign: 'center',
                lines: [
                    { text: currentTicker, color: 'rgba(120,130,150,0.10)', fontSize: 64, fontStyle: 'bold' },
                    { text: currentTF.label + ' · MOEX', color: 'rgba(120,130,150,0.08)', fontSize: 20 },
                ],
            });
        } catch (e) {}
    }

    function resizeChart() { const el = document.getElementById('chart-container'); chart.applyOptions({ width: el.clientWidth, height: el.clientHeight }); }
    function setStatus(t) { if (t) document.getElementById('status').textContent = t; }

    // ---- Helpers ----
    function formatVol(v) {
        if (v >= 1e9) return (v / 1e9).toFixed(1) + 'B';
        if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
        if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
        return v;
    }
    function updateInfo(d) {
        document.getElementById('info-o').textContent = d.open.toFixed(2);
        document.getElementById('info-h').textContent = d.high.toFixed(2);
        document.getElementById('info-l').textContent = d.low.toFixed(2);
        document.getElementById('info-c').textContent = d.close.toFixed(2);
        document.getElementById('info-v').textContent = formatVol(d.volume);
        const r = document.getElementById('info-rsi');
        r.textContent = d.rsi !== undefined ? d.rsi.toFixed(1) : '—';
        r.className = 'val' + (d.rsi > 70 ? ' red' : d.rsi < 30 ? ' green' : '');
        const m = document.getElementById('info-macd');
        m.textContent = d.macd !== undefined ? d.macd.toFixed(2) : '—';
        m.className = 'val' + (d.macdHist > 0 ? ' green' : d.macdHist < 0 ? ' red' : '');
    }

    function updateRangeBar(last) {
        const bar = document.getElementById('range-bar');
        if (!last || last.high === last.low) { bar.style.display = 'none'; return; }
        bar.style.display = 'inline-flex';
        document.getElementById('range-lo').textContent = last.low.toFixed(2);
        document.getElementById('range-hi').textContent = last.high.toFixed(2);
        const pct = Math.max(0, Math.min(100, (last.close - last.low) / (last.high - last.low) * 100));
        document.getElementById('range-dot').style.left = pct + '%';
    }

    function showCrossTip(d, point) {
        const tip = document.getElementById('cross-tip');
        const cont = document.getElementById('chart-container');
        const up = d.close >= d.open;
        const col = up ? '#26a69a' : '#ef5350';
        let html = `<div class="ct-date">${timeKey(d.time)}</div>`;
        html += `<div class="ct-row"><span class="ct-lbl">O</span><span>${d.open.toFixed(2)}</span></div>`;
        html += `<div class="ct-row"><span class="ct-lbl">H</span><span>${d.high.toFixed(2)}</span></div>`;
        html += `<div class="ct-row"><span class="ct-lbl">L</span><span>${d.low.toFixed(2)}</span></div>`;
        html += `<div class="ct-row"><span class="ct-lbl">C</span><span style="color:${col};font-weight:600">${d.close.toFixed(2)}</span></div>`;
        html += `<div class="ct-row"><span class="ct-lbl">Объём</span><span>${formatVol(d.volume)}</span></div>`;
        if (d.rsi !== undefined) html += `<div class="ct-row"><span class="ct-lbl">RSI</span><span style="color:${d.rsi>70?'#ef5350':d.rsi<30?'#26a69a':'#d1d4dc'}">${d.rsi.toFixed(1)}</span></div>`;
        if (d.macd !== undefined) html += `<div class="ct-row"><span class="ct-lbl">MACD</span><span style="color:${d.macdHist>0?'#26a69a':'#ef5350'}">${d.macd.toFixed(2)}</span></div>`;
        tip.innerHTML = html;
        tip.classList.add('show');
        const tw = tip.offsetWidth, th = tip.offsetHeight, cw = cont.clientWidth, ch = cont.clientHeight;
        let x = point.x + 16, y = point.y + 16;
        if (x + tw > cw) x = point.x - tw - 16;
        if (y + th > ch) y = ch - th - 4;
        tip.style.left = Math.max(2, x) + 'px';
        tip.style.top = Math.max(2, y) + 'px';
    }

    // ---- Drawing tools (lightweight-charts-drawing) ----

    const CAT_NAMES = { line:'Линии', shape:'Фигуры', channel:'Каналы', fibonacci:'Фибоначчи', pitchfork:'Вилы Эндрюса', gann:'Ганн', forecasting:'Прогноз', measurement:'Измерение', annotation:'Аннотации' };

    function initDrawingTools() {
        if (!hasDrawing) { document.getElementById('draw-btn').style.display = 'none'; return; }
        toolRegistry = LightweightChartsDrawing.getToolRegistry();
        drawManager = new LightweightChartsDrawing.DrawingManager();
        drawManager.attach(chart, candleSeries, document.getElementById('chart-container'));
        drawManager.on('drawing:added', saveDrawings);
        drawManager.on('drawing:updated', saveDrawings);
        drawManager.on('drawing:removed', saveDrawings);
        buildDrawPanel();

        const cont = document.getElementById('chart-container');
        cont.addEventListener('click', (ev) => {
            const rect = cont.getBoundingClientRect();
            const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
            const price = candleSeries.coordinateToPrice(y);
            if (alertMode) {
                if (price == null) return;
                const roundP = Math.round(price * 100) / 100;
                const last = lastData.length ? lastData[lastData.length-1].close : roundP;
                addAlert(currentTicker, roundP, roundP >= last ? 'above' : 'below');
                requestPermission(); renderAlerts(); renderAlertLines();
                exitDrawMode(`Алерт на ${roundP.toFixed(2)} добавлен`);
                return;
            }
            if (!activeDrawTool) {
                const hit = drawManager.hitTest({ x, y });
                if (hit) drawManager.selectDrawing(hit.id); else drawManager.deselectAll();
                return;
            }
            const time = chart.timeScale().coordinateToTime(x);
            if (time == null || price == null) return;
            pendingAnchors.push({ time, price });
            const def = toolRegistry.get(activeDrawTool);
            const need = def ? def.requiredAnchors : 2;
            if (pendingAnchors.length >= need) {
                const id = 'd' + Date.now() + Math.floor(Math.random()*1000);
                const drawing = toolRegistry.createDrawing(activeDrawTool, id, pendingAnchors.slice(), { lineColor: '#2962ff', lineWidth: 2 });
                if (drawing) drawManager.addDrawing(drawing);
                const name = def ? def.name : activeDrawTool;
                pendingAnchors = [];
                setStatus(`${name} добавлен · кликните снова или Esc для выхода`);
            } else {
                setStatus(`${def ? def.name : activeDrawTool}: точка ${pendingAnchors.length}/${need}, кликните ещё`);
            }
        });
    }

    function buildDrawPanel() {
        const panel = document.getElementById('draw-panel');
        panel.innerHTML = '';
        const cats = toolRegistry.getCategories();
        for (const cat of cats) {
            const tools = toolRegistry.getByCategory(cat);
            if (!tools.length) continue;
            const h = document.createElement('div'); h.className = 'draw-cat'; h.textContent = CAT_NAMES[cat] || cat;
            panel.appendChild(h);
            const grid = document.createElement('div'); grid.className = 'draw-grid';
            for (const t of tools) {
                const btn = document.createElement('div'); btn.className = 'draw-tool'; btn.dataset.tool = t.type;
                const ic = document.createElement('span'); ic.className = 'di'; ic.textContent = DRAW_ICONS[t.type] || '◆';
                const lbl = document.createElement('span'); lbl.textContent = t.name;
                btn.append(ic, lbl);
                btn.onclick = () => { activateDrawTool(t.type); };
                grid.appendChild(btn);
            }
            panel.appendChild(grid);
        }
        const foot = document.createElement('div'); foot.className = 'draw-panel-foot';
        const delBtn = document.createElement('button'); delBtn.textContent = '🗑 Удалить выбранный';
        delBtn.onclick = () => { const sel = drawManager.getSelectedDrawing(); if (sel) { drawManager.removeDrawing(sel.id); saveDrawings(); } panel.classList.remove('show'); };
        const clrBtn = document.createElement('button'); clrBtn.textContent = '✕ Очистить всё';
        clrBtn.onclick = () => { drawManager.clearAll(); saveDrawings(); panel.classList.remove('show'); };
        foot.append(delBtn, clrBtn);
        panel.appendChild(foot);
    }

    function activateDrawTool(type) {
        if (!drawManager) return;
        if (activeDrawTool === type) { exitDrawMode(''); return; }
        exitDrawMode('');
        activeDrawTool = type;
        pendingAnchors = [];
        drawManager.setActiveTool(type);
        const def = toolRegistry.get(type);
        const drawBtn = document.getElementById('draw-btn');
        drawBtn.classList.add('active');
        drawBtn.title = def ? def.name : type;
        document.querySelectorAll('.draw-tool').forEach(b => b.classList.toggle('active', b.dataset.tool === type));
        document.getElementById('chart-container').classList.add('draw-active');
        document.getElementById('status').classList.add('draw-active');
        setStatus(`✏ ${def ? def.name : type}: кликните на графике (точек: ${def ? def.requiredAnchors : 2}) · Esc = выход`);
    }

        const body = document.getElementById('adv-text');

        const { sma20, sma50, rsi, macdData, sr, patterns, signals, atr, regime } = lastIndicators;

        const cur50 = sma50.length ? sma50[sma50.length-1].value : null;
        if (cur20 && cur50) lines.push((cur20 > cur50 ? '▲ Тренд восходящий' : '▼ Тренд нисходящий') + ` (SMA20 ${cur20.toFixed(1)} / SMA50 ${cur50.toFixed(1)})`);
        const curRsi = rsi.length ? rsi[rsi.length-1].value : null;
        if (curRsi != null) lines.push(curRsi > 70 ? `RSI перекуплен (${curRsi.toFixed(1)}) — риск коррекции` : curRsi < 30 ? `RSI перепродан (${curRsi.toFixed(1)}) — возможен отскок` : `RSI нейтрально (${curRsi.toFixed(1)})`);
        if (macdData.macd.length) {
            const lm = macdData.macd[macdData.macd.length-1].value, ls = macdData.signal[macdData.signal.length-1].value;
            lines.push(lm > ls ? 'MACD выше сигнальной — бычий' : 'MACD ниже сигнальной — медвежий');
        }
        const recentP = patterns.filter(p => p.idx >= lastData.length - 3);
        if (recentP.length) recentP.forEach(p => lines.push(`${p.dir === 'bull' ? '▲' : p.dir === 'bear' ? '▼' : '◆'} ${p.name} (${p.conf}%)`));
        if (regime && regime.regime !== 'unknown') lines.unshift(`<span style="color:${regime.color}">● ${regime.label}</span>`);

        let html = lines.map(l => `<div class="adv-line">${l}</div>`).join('');
        const lastSig = signals.length ? signals[signals.length - 1] : null;
        let rec = 'neutral', recText = 'НЕЙТРАЛЬНО', entry = last.close, stop = null, target = null;
        let gaugeValue = 50;
        if (lastSig && signals[signals.length-1].time === last.time) {
            rec = lastSig.type === 'BUY' ? 'buy' : 'sell';
            recText = lastSig.type === 'BUY' ? 'ПОКУПКА' : 'ПРОДАЖА';
            const a = atr.length ? atr[atr.length-1].value : last.close * 0.02;
            if (lastSig.type === 'BUY') { stop = entry - a * 2; target = entry + a * 3; gaugeValue = 50 + lastSig.score * 10; }
            else { stop = entry + a * 2; target = entry - a * 3; gaugeValue = 50 - lastSig.score * 10; }
        } else {
            let score = 0;
            if (cur20 && cur50 && cur20 > cur50) score += 10;
            if (cur20 && cur50 && cur20 < cur50) score -= 10;
            if (curRsi != null && curRsi < 35) score += 10;
            if (curRsi != null && curRsi > 65) score -= 10;
            if (macdData.macd.length) { const lm = macdData.macd[macdData.macd.length-1].value, ls = macdData.signal[macdData.signal.length-1].value; if (lm > ls) score += 5; else score -= 5; }
            gaugeValue = Math.max(0, Math.min(100, 50 + score));
        }
        html += `<div class="adv-rec ${rec}"><b class="${rec === 'buy' ? 'green' : rec === 'sell' ? 'red' : 'muted'}">${recText}</b>`;
        if (stop != null) {
            const rr = Math.abs((target - entry) / (stop - entry));
            html += `<div class="adv-line">Вход ${entry.toFixed(2)} · Стоп ${stop.toFixed(2)} · Цель ${target.toFixed(2)} · R/R 1:${rr.toFixed(1)}</div>`;
            if (lastSig.reasons) html += `<div class="adv-line muted">${lastSig.reasons.join(' · ')}</div>`;
        } else {
            html += `<div class="adv-line muted">Цена ${last.close.toFixed(2)}. Ждите подтверждения.</div>`;
        }
        html += '</div>';
        body.innerHTML = html;
        updateGauge(gaugeValue);
    }

    // ---- Backtest + Equity Curve ----
    function runBacktest() {
        const statsEl = document.getElementById('bt-stats');
        const signals = lastIndicators.signals || [];
        const data = lastData;
        if (!signals.length || data.length < 20) { statsEl.innerHTML = '<span class="muted">Недостаточно данных для бэктеста</span>'; renderEquityCurve([]); return; }
        const atr = lastIndicators.atr || [];
        const atrMap = new Map();
        for (const a of atr) atrMap.set(timeKey(a.time), a.value);
        const dataMap = new Map();
        for (let i = 0; i < data.length; i++) dataMap.set(timeKey(data[i].time), i);

        let wins = 0, losses = 0, totalPnl = 0, maxDD = 0, equity = 0, peak = 0;
        const trades = [];

        for (const sig of signals) {
            const idx = dataMap.get(timeKey(sig.time));
            if (idx == null || idx + 1 >= data.length) continue;
            const entry = data[idx + 1].open;
            const a = atrMap.get(timeKey(sig.time)) || entry * 0.02;
            const sl = sig.type === 'BUY' ? entry - a * 2 : entry + a * 2;
            const tp = sig.type === 'BUY' ? entry + a * 3 : entry - a * 3;
            let exitPrice = null, exitReason = '';
            for (let j = idx + 1; j < Math.min(idx + 21, data.length); j++) {
                if (sig.type === 'BUY') {
                    if (data[j].low <= sl) { exitPrice = sl; exitReason = 'стоп'; break; }
                    if (data[j].high >= tp) { exitPrice = tp; exitReason = 'цель'; break; }
                } else {
                    if (data[j].high >= sl) { exitPrice = sl; exitReason = 'стоп'; break; }
                    if (data[j].low <= tp) { exitPrice = tp; exitReason = 'цель'; break; }
                }
            }
            if (!exitPrice) { exitPrice = data[Math.min(idx + 20, data.length - 1)].close; exitReason = 'время'; }
            const pnl = sig.type === 'BUY' ? exitPrice - entry : entry - exitPrice;
            const pnlPct = (pnl / entry) * 100;
            if (pnl > 0) wins++; else losses++;
            totalPnl += pnlPct;
            equity += pnlPct;
            if (equity > peak) peak = equity;
            if (peak - equity > maxDD) maxDD = peak - equity;
            trades.push({ type: sig.type, entry: entry.toFixed(2), exit: exitPrice.toFixed(2), pnl: pnlPct.toFixed(2), reason: exitReason, time: sig.time });
        }
        const total = wins + losses;
        const winRate = total ? (wins / total * 100).toFixed(1) : 0;
        const avgPnl = total ? (totalPnl / total).toFixed(2) : 0;
        const grossW = trades.filter(t => parseFloat(t.pnl) > 0).reduce((s, t) => s + parseFloat(t.pnl), 0);
        const grossL = Math.abs(trades.filter(t => parseFloat(t.pnl) < 0).reduce((s, t) => s + parseFloat(t.pnl), 0));
        const pf = grossL > 0 ? (grossW / grossL).toFixed(2) : '∞';

        let html = `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px;">`;
        html += `<span><span class="label">Сделок:</span> <b>${total}</b></span>`;
        html += `<span><span class="label">Win:</span> <b class="${winRate >= 50 ? 'green' : 'red'}">${winRate}%</b></span>`;
        html += `<span><span class="label">PF:</span> <b class="${pf >= 1 ? 'green' : 'red'}">${pf}</b></span>`;
        html += `<span><span class="label">Ср.P&L:</span> <b class="${avgPnl >= 0 ? 'green' : 'red'}">${avgPnl}%</b></span>`;
        html += `<span><span class="label">MaxDD:</span> <b class="red">${maxDD.toFixed(2)}%</b></span>`;
        html += `</div>`;
        html += '<table class="data"><thead><tr><th>Тип</th><th>Вход</th><th>Выход</th><th>P&L%</th><th>Причина</th></tr></thead><tbody>';
        for (const t of trades.slice(-10).reverse()) {
            html += `<tr><td class="${t.type === 'BUY' ? 'green' : 'red'}">${t.type}</td><td>${t.entry}</td><td>${t.exit}</td><td class="${parseFloat(t.pnl) >= 0 ? 'green' : 'red'}">${t.pnl}%</td><td class="muted">${t.reason}</td></tr>`;
        }
        html += '</tbody></table>';
        statsEl.innerHTML = html;
        renderEquityCurve(trades);
    }

    function drawSparkline(canvas, data) {
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        if (!data || data.length < 2) return;
        const min = Math.min(...data), max = Math.max(...data);
        const range = max - min || 1;
        const color = data[data.length - 1] >= data[0] ? '#26a69a' : '#ef5350';
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        for (let i = 0; i < data.length; i++) {
            const x = (i / (data.length - 1)) * w;
            const y = h - ((data[i] - min) / range) * (h - 4) - 2;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

            columns: [
                { title: 'Тикер', field: 'ticker', width: 70 },
                { title: 'Имя', field: 'shortname', minWidth: 80 },
                { title: 'Цена', field: 'last', hozAlign: 'right', width: 80,
                    formatter: function(cell) { return cell.getValue()?.toFixed(2) || '—'; } },
                { title: 'Изм.%', field: 'change', hozAlign: 'right', width: 75,
                    formatter: function(cell) {
                        const v = cell.getValue();
                        cell.getElement().style.color = v >= 0 ? '#26a69a' : '#ef5350';
                        return (v >= 0 ? '+' : '') + (v != null ? v.toFixed(2) : '0.00') + '%';
                    }
                },
                { title: 'Объём', field: 'volume', hozAlign: 'right', width: 85,
                    formatter: function(cell) { return formatVol(cell.getValue()); } },
                { title: 'Время', field: 'time', hozAlign: 'center', width: 70 },
            ],
        });
    }

    function updateScreener(prices) {
        if (!screenerTable || !prices) return;
        screenerTable.replaceData(prices.map(p => ({
            ticker: p.ticker, shortname: p.shortname, last: p.last,
            change: p.change != null ? parseFloat(p.change) : 0,
            volume: p.volume || 0, time: p.time || '',
        })));
    }

    // ---- Init ----
    initChart();
    initDrawingTools();
    initDepthChart();
    setTimeout(initGauge, 100);
    loadData();
    refreshWatchlist();
    setTimeout(fetchSparkData, 3000);
    setInterval(refreshWatchlist, 60000);
    setInterval(() => { if (!document.getElementById('orderbook').classList.contains('collapsed')) refreshOrderBook(); }, 30000);
    setInterval(fetchSparkData, 300000);
    </script>
</body>
</html>
