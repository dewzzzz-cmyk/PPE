<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOEX Trading Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #131722; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 16px;
            background: #1e222d;
            border-bottom: 1px solid #2a2e39;
        }
        .header h1 { color: #d1d4dc; font-size: 15px; font-weight: 500; }
        .tickers { display: flex; gap: 4px; flex-wrap: wrap; }
        .tickers button {
            background: #2a2e39;
            color: #d1d4dc;
            border: 1px solid #363a45;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
        }
        .tickers button:hover { background: #363a45; }
        .tickers button.active { background: #2962ff; border-color: #2962ff; color: #fff; }
        .chart-wrap { width: 100%; height: calc(100vh - 38px); }
    </style>
</head>
<body>
    <div class="header">
        <h1>MOEX Trading</h1>
        <div class="tickers" id="ticker-bar"></div>
    </div>
    <div class="chart-wrap" id="chart-wrap"></div>

    <script>
        const tickers = [
            { label: 'SBER', symbol: 'MOEX:SBER' },
            { label: 'GAZP', symbol: 'MOEX:GAZP' },
            { label: 'LKOH', symbol: 'MOEX:LKOH' },
            { label: 'YNDX', symbol: 'MOEX:YNDX' },
            { label: 'GMKN', symbol: 'MOEX:GMKN' },
            { label: 'ROSN', symbol: 'MOEX:ROSN' },
            { label: 'NVTK', symbol: 'MOEX:NVTK' },
            { label: 'MTSS', symbol: 'MOEX:MTSS' },
            { label: 'MGNT', symbol: 'MOEX:MGNT' },
            { label: 'PLZL', symbol: 'MOEX:PLZL' },
            { label: 'IMOEX', symbol: 'MOEX:IMOEX' },
        ];

        const bar = document.getElementById('ticker-bar');
        tickers.forEach((t, i) => {
            const btn = document.createElement('button');
            btn.textContent = t.label;
            btn.dataset.symbol = t.symbol;
            if (i === 0) btn.classList.add('active');
            btn.onclick = () => {
                bar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadChart(t.symbol);
            };
            bar.appendChild(btn);
        });

        function loadChart(symbol) {
            const wrap = document.getElementById('chart-wrap');
            wrap.innerHTML = '';

            const container = document.createElement('div');
            container.className = 'tradingview-widget-container';
            container.style.height = '100%';
            container.style.width = '100%';

            const inner = document.createElement('div');
            inner.className = 'tradingview-widget-container__widget';
            inner.style.height = 'calc(100% - 32px)';
            inner.style.width = '100%';
            container.appendChild(inner);

            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
            script.async = true;
            script.textContent = JSON.stringify({
                "autosize": true,
                "symbol": symbol,
                "interval": "60",
                "timezone": "Europe/Moscow",
                "theme": "dark",
                "style": "1",
                "locale": "ru",
                "allow_symbol_change": true,
                "details": true,
                "hotlist": true,
                "calendar": false,
                "hide_side_toolbar": false,
                "withdateranges": true,
                "support_host": "https://www.tradingview.com"
            });
            container.appendChild(script);

            wrap.appendChild(container);
        }

        loadChart('MOEX:SBER');
    </script>
</body>
</html>
